    // Browser Native SHA-256 Hashing
    async function sha256(text) {
      const msgBuffer = new TextEncoder().encode(text.trim());
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Pluggable verification routine
    async function verifyTreasurerCode(club, inputCode) {
      if (!club || !inputCode || club.locked) return false;
      const inputHash = await sha256(inputCode);
      return inputHash === club.codeHash;
    }

    const formatINR = (val) => {
      const num = Number(val) || 0;
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        maximumFractionDigits: 0
      }).format(num);
    };

    const sanitize = (str) => {
      if (typeof str !== 'string') return '';
      return str.replace(/[<>]/g, '').trim();
    };

    const normalizeBillNo = (val) => {
      return (val || '').toLowerCase().replace(/[^a-z0-9]/g, '');

      // -------------------------------------------------------------
      // DUPLICATE BILL GUARDRAILS (3 HEURISTICS)
      // -------------------------------------------------------------
      const detectDuplicates = (orderInput) => {
        const normBill = normalizeBillNo(orderInput.billNo);
        const orderDate = new Date(orderInput.billDate);
        const total = Number(orderInput.total);
        const itemSignature = orderInput.items
          .map(i => `${sanitize(i.name).toLowerCase()}:${i.qty}:${i.price}`)
          .sort()
          .join('|');

        for (const existing of orders) {
          // Heuristic A: Exact shop bill collision
          if (normBill && normalizeBillNo(existing.billNo) === normBill) {
            return `Duplicate Bill Number collision: "${orderInput.billNo}" matches existing ${existing.id} (${existing.clubId.toUpperCase()})`;
          }
          // Heuristic B: Same club + Same total + Same bill date
          if (existing.clubId === orderInput.clubId && Number(existing.total) === total && existing.billDate === orderInput.billDate) {
            return `Identical Expense: ${existing.clubId.toUpperCase()} already submitted bill of ${formatINR(total)} on ${existing.billDate}`;
          }
          // Heuristic C: Same club + Same items within 3 days
          if (existing.clubId === orderInput.clubId && Number(existing.total) === total) {
            const diffDays = Math.abs(orderDate - new Date(existing.billDate)) / (1000 * 60 * 60 * 24);
            if (diffDays <= 3) {
              const existingSig = existing.items.map(i => `${sanitize(i.name).toLowerCase()}:${i.qty}:${i.price}`).sort().join('|');
              if (itemSignature === existingSig) {
                return `Redundant Purchase: Identical line items & total submitted within 3 days of ${existing.id}`;
              }
            }
          }
        }
        return null;
      };

          status: 'Awaiting code',
          flagged: isFlagged,
          flagReason: dupReason || '',
          createdAt: new Date().toISOString()

          isFlagged ? 'warning' : 'success'
        );
        setActiveTab('orders');
      };

      // -------------------------------------------------------------
      // SECURITY VERIFICATION EXECUTION
      // -------------------------------------------------------------
      const handleTriggerSecureAction = (actionType, order, extra = {}) => {
        const club = clubs.find(c => c.id === order.clubId);
        if (!club) return;
        if (club.locked) {
          alert(`SECURITY LOCKOUT: Approval authority for ${club.name} is LOCKED due to 3 consecutive wrong passcodes. Only Dean/Admin can unlock.`);
          return;
        }

        setAuthModal({
          isOpen: true,
          actionType,
          targetOrder: order,
          targetPaymentData: extra.paymentData || null,
          targetFlag: extra.flag || null,
          decision: extra.decision || null,
          inputCode: '',
          errorMessage: ''
        });
      };

      const handleExecuteAuthorization = async (e) => {
        e.preventDefault();
        const { actionType, targetOrder, targetPaymentData, targetFlag, decision, inputCode } = authModal;
        const club = clubs.find(c => c.id === targetOrder.clubId);
        if (!club) return;

        // SHA-256 verification
        const isMatch = await verifyTreasurerCode(club, inputCode);

        if (!isMatch) {
          const failed = (club.failedAttempts || 0) + 1;
          const isNowLocked = failed >= 3;
          const remaining = 3 - failed;

          setClubs(prev => prev.map(c => c.id === club.id ? { ...c, failedAttempts: failed, locked: isNowLocked } : c));

          logAudit(
            'Security Gatekeeper',
            isNowLocked ? 'CLUB_LOCKED' : 'FAILED_CODE_ATTEMPT',
            'Club',
            club.id,
            `Failed passcode attempt #${failed} on ${club.name}. ${isNowLocked ? 'HARD LOCKOUT ACTIVATED.' : `${remaining} attempts remaining.`}`
          );

          if (isNowLocked) {
            setAuthModal(prev => ({ ...prev, isOpen: false }));
            alert(`SECURITY BREACH PREVENTED: 3 incorrect passcodes entered. Approvals for ${club.name} are now FROZEN. Admin unlock required.`);
          } else {
            setAuthModal(prev => ({
              ...prev,
              errorMessage: `Incorrect passcode. Guardrail alert: ${remaining} attempt(s) remaining before automatic team lock!`
            }));
          }
          return;
        }

        // Passcode succeeded: clear fail counter
        setClubs(prev => prev.map(c => c.id === club.id ? { ...c, failedAttempts: 0 } : c));

        if (actionType === 'authorize') {
          setOrders(prev => prev.map(o => o.id === targetOrder.id ? { ...o, status: 'Authorized' } : o));
          logAudit(currentUser.name, 'ORDER_AUTHORIZED', 'Order', targetOrder.id, `Authorized PO total ${formatINR(targetOrder.total)}`);
          showToast(`Order ${targetOrder.id} authorized. Added to billing queue.`, 'success');
        } 
        else if (actionType === 'reject') {
          setOrders(prev => prev.map(o => o.id === targetOrder.id ? { ...o, status: 'Rejected' } : o));
          logAudit(currentUser.name, 'ORDER_REJECTED', 'Order', targetOrder.id, `Rejected PO total ${formatINR(targetOrder.total)}`);
          showToast(`Order ${targetOrder.id} rejected.`, 'info');
        }
        else if (actionType === 'record_payment') {
          const payAmt = Number(targetPaymentData.amount);
          const payId = `PAY-${Date.now().toString().slice(-4)}`;
          
          const newPayment = {
            id: payId,
            orderId: targetOrder.id,
            clubId: targetOrder.clubId,
            amount: payAmt,
            mode: targetPaymentData.mode,
            reference: targetPaymentData.reference || 'N/A',
            date: targetPaymentData.date,
            note: targetPaymentData.note || '',
            recordedBy: currentUser.name
          };

          const existingPaid = payments.filter(p => p.orderId === targetOrder.id).reduce((s, p) => s + p.amount, 0);
          const totalAfter = existingPaid + payAmt;
          const nextStatus = totalAfter >= targetOrder.total ? 'Paid' : 'Partially paid';

          setPayments(prev => [newPayment, ...prev]);
          setOrders(prev => prev.map(o => o.id === targetOrder.id ? { ...o, status: nextStatus } : o));

          logAudit(currentUser.name, 'PAYMENT_RECORDED', 'Payment', payId, `Recorded payment of ${formatINR(payAmt)} (${nextStatus})`);
          showToast(`Payment of ${formatINR(payAmt)} registered. Status: ${nextStatus}`, 'success');
        }
        else if (actionType === 'review_flag') {
          setFlags(prev => prev.map(f => f.id === targetFlag.id ? {
            ...f,
            status: decision,
            reviewedBy: currentUser.name,
            reviewedAt: new Date().toISOString()
          } : f));

          if (decision === 'confirmed_duplicate') {
            setOrders(prev => prev.map(o => o.id === targetOrder.id ? { ...o, status: 'Rejected', flagReason: 'Confirmed Duplicate (Voided)' } : o));
            logAudit(currentUser.name, 'REVERSAL_ENTRY', 'Order', targetOrder.id, `Confirmed duplicate flag: voided ${formatINR(targetOrder.total)} via reversal.`);
          } else {
            logAudit(currentUser.name, 'FLAG_RESOLVED_VALID', 'Flag', targetFlag.id, `Cleared flag as genuine expenditure.`);
          }
          showToast(`Flag marked: ${decision}`, 'info');
        }

        setAuthModal(prev => ({ ...prev, isOpen: false, inputCode: '', errorMessage: '' }));
      };

      // Admin Unlock Action
      const handleAdminUnlock = (clubId) => {
        const club = clubs.find(c => c.id === clubId);
        setClubs(prev => prev.map(c => c.id === clubId ? { ...c, locked: false, failedAttempts: 0 } : c));
        logAudit(currentUser.name, 'CLUB_UNLOCKED', 'Club', clubId, `Admin security unlock granted for ${club?.name}`);
        showToast(`Security lock cleared for ${club?.name}.`, 'success');
      };

      // CSV Export
      const handleExportCSV = (type) => {
        let headers = [];
        let rows = [];
        if (type === 'orders') {
          headers = ['Order ID', 'Club', 'Category', 'Requested By', 'Event', 'Bill No', 'Date', 'Amount', 'Status', 'Flagged'];
          rows = orders.map(o => [o.id, o.clubId, o.category, `"${o.requestedBy}"`, `"${o.event}"`, o.billNo, o.billDate, o.total, o.status, o.flagged ? 'YES' : 'NO']);
        } else {
          headers = ['Payment ID', 'Order ID', 'Club', 'Amount', 'Mode', 'Reference', 'Date', 'Signee'];
          rows = payments.map(p => [p.id, p.orderId, p.clubId, p.amount, p.mode, `"${p.reference}"`, p.date, `"${p.recordedBy}"`]);
        }
        const content = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const encoded = encodeURI(content);
        const link = document.createElement("a");
        link.setAttribute("href", encoded);
        link.setAttribute("download", `CampusVault_${type}_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Derived Metrics & Budgets
      const clubLedgers = useMemo(() => {
        return clubs.map(c => {
          const clubOrders = orders.filter(o => o.clubId === c.id);
          const authorizedOrders = clubOrders.filter(o => ['Authorized', 'Partially paid', 'Paid'].includes(o.status));
          const spent = authorizedOrders.reduce((sum, o) => sum + Number(o.total), 0);
          const clubPayments = payments.filter(p => p.clubId === c.id);
          const paid = clubPayments.reduce((sum, p) => sum + Number(p.amount), 0);
          const pending = Math.max(0, spent - paid);
          const remaining = c.annualBudget - spent;
          const percentSpent = c.annualBudget > 0 ? (spent / c.annualBudget) * 100 : 0;
          return { ...c, spent, paid, pending, remaining, percentSpent };
        });
      }, [clubs, orders, payments]);

      // Category Analytics based on Mobile Dashboard UI
      const categoryMetrics = useMemo(() => {
        const categories = ['Events', 'Marketing & Prints', 'Tech & Equipment'];
        return categories.map(cat => {
          const catOrders = orders.filter(o => o.category === cat && ['Authorized', 'Partially paid', 'Paid'].includes(o.status));
          const totalSpent = catOrders.reduce((s, o) => s + o.total, 0);
          const allocatedBudget = cat === 'Events' ? 120000 : cat === 'Marketing & Prints' ? 80000 : 200000;
          return {
            category: cat,
            spent: totalSpent,
            budget: allocatedBudget,
            percent: Math.min(100, Math.round((totalSpent / allocatedBudget) * 100))
          };
        });
      }, [orders]);

      // Filtered orders for view
      const displayOrders = useMemo(() => {
        if (!currentUser) return [];
        if (currentUser.role === 'member' || currentUser.role === 'treasurer') {
          return orders.filter(o => o.clubId === currentUser.clubId);
        }
        return orders;
      }, [orders, currentUser]);

      // =============================================================

      if (!currentUser) {

            <div className="max-w-md w-full bg-slate-800/90 border border-slate-700 backdrop-blur-xl rounded-2xl p-6 sm:p-8 shadow-2xl text-white relative z-10">
              
              {/* Institution Emblem Header */}
              <div className="text-center space-y-2 mb-6">
                <div className="inline-flex p-3 rounded-2xl bg-gradient-to-br from-pccoe-500 to-pccoe-700 shadow-lg shadow-pccoe-500/30">
                  <span className="text-3xl">🏛️</span>
                </div>
                <h1 className="text-2xl font-black tracking-tight text-white">Campus Vault</h1>
                <p className="text-xs font-semibold text-pccoe-300 uppercase tracking-widest">

              {loginError && (

              {/* Login Form */}

                <button

                    </button>

                </div>
              </div>

            </div>
          </div>

      // =============================================================

              <div className={`px-4 py-3 rounded-xl shadow-xl flex items-center space-x-2 text-xs font-bold ${

                toast.type === 'warning' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-white'

                <span>{toast.message}</span>
              </div>
            </div>
          )}

          {/* APPLICATION TOP BAR */}
          <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 shadow-md no-print">
            <div className="max-w-7xl mx-auto px-4 py-2.5 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-3">
              
              {/* Institution & App Header */}
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-pccoe-600 to-pccoe-400 flex items-center justify-center text-white font-black text-lg shadow-md border border-pccoe-300/30">
                  CV
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h1 className="text-base font-extrabold tracking-tight text-white">Campus Vault</h1>
                    <span className="text-[10px] bg-pccoe-500/30 text-pccoe-300 border border-pccoe-400/30 px-1.5 py-0.2 rounded font-mono">v2.0 PCCOE</span>
                  </div>
                  <p className="text-[11px] text-slate-400">Pimpri Chinchwad College of Engineering</p>
                </div>
              </div>

              {/* User Session & Guardrail Status */}
              <div className="flex flex-wrap items-center gap-2">
                <div className="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl flex items-center space-x-2 text-xs">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <div>
                    <span className="font-bold text-slate-200">{currentUser.name}</span>

                <button

                  clubs={clubs}

                  onTriggerSecureAction={handleTriggerSecureAction}
                />

              {/* TAB 7: AUDIT LOG */}
              {activeTab === 'audit' && (
                <AuditTrailView
                  auditLogs={auditLogs}
                  clubs={clubs}
                />

            </main>
          </div>

          {/* MOBILE BOTTOM NAVIGATION BAR */}
          <nav id="bottom-nav" className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-40 flex justify-around items-center px-1 py-2 text-xs">
            <button onClick={() => setActiveTab('orders')} className={`flex flex-col items-center ${activeTab === 'orders' ? 'text-pccoe-600 font-bold' : 'text-slate-500'}`}>
              <span>📦</span><span>Orders</span>

            <button onClick={() => setActiveTab('budget')} className={`flex flex-col items-center ${activeTab === 'budget' ? 'text-pccoe-600 font-bold' : 'text-slate-500'}`}>
              <span>📊</span><span>Budget</span>

            {['member', 'treasurer'].includes(currentUser.role) && (
              <button onClick={() => setActiveTab('new-order')} className={`flex flex-col items-center ${activeTab === 'new-order' ? 'text-pccoe-600 font-bold' : 'text-slate-500'}`}>

            <button onClick={() => setActiveTab('clubs')} className={`flex flex-col items-center ${activeTab === 'clubs' ? 'text-pccoe-600 font-bold' : 'text-slate-500'}`}>
              <span>🏛️</span><span>Teams</span>

            <button onClick={() => setActiveTab('flags')} className={`flex flex-col items-center relative ${activeTab === 'flags' ? 'text-pccoe-600 font-bold' : 'text-slate-500'}`}>
              <span>🚩</span><span>Flags</span>
              {flags.filter(f => f.status === 'pending').length > 0 && (
                <span className="absolute top-0 right-1 w-2 h-2 bg-rose-500 rounded-full"></span>
              )}
            </button>
          </nav>

          {/* ========================================================= */}
          {/* SECURITY PASSCODE AUTHORIZATION MODAL */}
          {/* ========================================================= */}
          {authModal.isOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 animate-in fade-in">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div className="flex items-center space-x-2">
                    <span className="p-2 bg-pccoe-50 text-pccoe-600 rounded-xl text-lg">🔐</span>
                    <div>
                      <h3 className="text-sm font-bold text-slate-900">
                        {authModal.actionType === 'authorize' && 'Authorize Expense PO'}
                        {authModal.actionType === 'reject' && 'Reject Expense PO'}
                        {authModal.actionType === 'record_payment' && 'Verify Payment Signoff'}
                        {authModal.actionType === 'review_flag' && 'Verify Duplicate Resolution'}
                      </h3>
                      <p className="text-[11px] text-slate-500">Security Gatekeeper verification required</p>
                    </div>
                  </div>
                  <button 
                    onClick={() => setAuthModal(prev => ({ ...prev, isOpen: false }))}
                    className="text-slate-400 hover:text-slate-600 text-xl font-bold"
                  >
                    &times;
                  </button>
                </div>

                <div className="my-4 bg-slate-50 p-3 rounded-xl text-xs space-y-1.5 border border-slate-200">
                  <div className="flex justify-between">
                    <span className="text-slate-500">Order Reference:</span>
                    <span className="font-bold text-slate-800">{authModal.targetOrder?.id}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Event / Purpose:</span>
                    <span className="text-slate-700">{authModal.targetOrder?.event}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Bill Total:</span>
                    <span className="font-extrabold text-pccoe-700">{formatINR(authModal.targetOrder?.total)}</span>
                  </div>
                  {authModal.targetPaymentData && (
                    <div className="flex justify-between border-t border-slate-200 pt-1 text-emerald-700 font-bold">
                      <span>Payment to Sign:</span>
                      <span>{formatINR(authModal.targetPaymentData.amount)} ({authModal.targetPaymentData.mode})</span>
                    </div>
                  )}
                </div>

                <form onSubmit={handleExecuteAuthorization} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      Enter Private Treasurer Passcode
                    </label>
                    <input
                      type="password"
                      autoFocus
                      maxLength={8}
                      placeholder="••••"
                      value={authModal.inputCode}
                      onChange={(e) => setAuthModal(prev => ({ ...prev, inputCode: e.target.value, errorMessage: '' }))}
                      className="w-full text-center tracking-widest text-2xl font-mono px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-pccoe-500 focus:outline-none"
                    />
                    <p className="text-[10px] text-slate-400 mt-1 text-center">
                      3 failed entries will trigger immediate lockout of team approvals.
                    </p>
                  </div>

                  {authModal.errorMessage && (
                    <div className="p-2.5 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl font-medium">
                      ⚠️ {authModal.errorMessage}
                    </div>
                  )}

                  <div className="flex space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setAuthModal(prev => ({ ...prev, isOpen: false }))}
                      className="flex-1 py-2 px-3 border border-slate-300 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-50"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={!authModal.inputCode.trim()}
                      className="flex-1 py-2 px-3 bg-pccoe-600 hover:bg-pccoe-700 disabled:opacity-50 text-white rounded-xl text-xs font-bold shadow-md"
                    >
                      Sign & Authenticate
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* PRINTABLE BILL VOUCHER / LEDGER MODAL */}
          {/* ========================================================= */}
          {printPreview && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm">
              <div className="bg-white rounded-2xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto print-card">
                <div className="flex justify-between items-center mb-6 no-print border-b pb-3">
                  <h3 className="font-bold text-slate-800">Print Preview</h3>
                  <div className="flex space-x-2">
                    <button
                      onClick={() => window.print()}
                      className="px-3 py-1.5 bg-pccoe-600 text-white text-xs font-bold rounded-xl shadow hover:bg-pccoe-700"
                    >
                      🖨️ Print Document
                    </button>
                    <button
                      onClick={() => setPrintPreview(null)}
                      className="px-3 py-1.5 border border-slate-300 text-xs font-semibold rounded-xl text-slate-700"
                    >
                      Close
                    </button>
                  </div>
                </div>

                {printPreview.type === 'order' && (
                  <div className="space-y-4 text-slate-800 text-xs">
                    <div className="border-b pb-4 text-center">
                      <h2 className="text-base font-extrabold uppercase tracking-wide">Pimpri Chinchwad College of Engineering</h2>
                      <p className="text-slate-500">Designated Stationery & Refreshments Shop Procurement Voucher</p>
                      <p className="font-mono mt-1 text-slate-600">PO: {printPreview.data.id} | Shop Bill No: {printPreview.data.billNo}</p>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <p className="text-slate-500">Club / Unit:</p>
                        <p className="font-bold text-slate-900">{clubs.find(c => c.id === printPreview.data.clubId)?.name}</p>
                        <p className="text-slate-500 mt-1">Requested By: <span className="font-semibold text-slate-900">{printPreview.data.requestedBy}</span></p>
                      </div>
                      <div className="text-right">
                        <p className="text-slate-500">Date: <span className="font-bold text-slate-800">{printPreview.data.billDate}</span></p>
                        <p className="text-slate-500">Category: <span className="font-bold text-slate-800">{printPreview.data.category}</span></p>
                        <p className="mt-1">Status: <span className="font-bold text-pccoe-700 uppercase">{printPreview.data.status}</span></p>
                      </div>
                    </div>

                    <table className="w-full text-left border border-slate-200 mt-4">
                      <thead className="bg-slate-100 border-b">
                        <tr>
                          <th className="p-2">Item Description</th>
                          <th className="p-2 text-center">Qty</th>
                          <th className="p-2 text-right">Unit Price</th>
                          <th className="p-2 text-right">Total</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {printPreview.data.items.map((it, idx) => (
                          <tr key={idx}>
                            <td className="p-2">{it.name}</td>
                            <td className="p-2 text-center">{it.qty}</td>
                            <td className="p-2 text-right">{formatINR(it.price)}</td>
                            <td className="p-2 text-right font-medium">{formatINR(it.qty * it.price)}</td>
                          </tr>
                        ))}
                      </tbody>
                      <tfoot className="bg-slate-50 font-bold border-t">
                        <tr>
                          <td colSpan={3} className="p-2 text-right">Grand Total:</td>
                          <td className="p-2 text-right text-pccoe-700">{formatINR(printPreview.data.total)}</td>
                        </tr>
                      </tfoot>
                    </table>

                    <div className="mt-8 pt-4 border-t grid grid-cols-2 gap-8 text-[10px] text-center text-slate-500">
                      <div>
                        <div className="h-10 border-b border-slate-300"></div>
                        <p className="mt-1">Faculty In-Charge / Treasurer Sign</p>
                      </div>
                      <div>
                        <div className="h-10 border-b border-slate-300"></div>

                      </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // =============================================================
    // SECTION 4: SUB-COMPONENTS & VIEWS
    // =============================================================

    // -------------------------------------------------------------
    // 4.1: ORDERS LIST VIEW
    // -------------------------------------------------------------
    function OrdersView({ orders, clubs, payments, currentUser, highValueThreshold, onTriggerSecureAction, onPrintOrder, onExportCSV, onGoToNew }) {
      const [filterStatus, setFilterStatus] = useState('all');
      const [filterCategory, setFilterCategory] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [paymentModalOrder, setPaymentModalOrder] = useState(null);

      const [payForm, setPayForm] = useState({
        amount: '',
        mode: 'UPI',
        reference: '',
        date: new Date().toISOString().slice(0, 10),
        note: '',
        error: ''
      });

      const filtered = useMemo(() => {
        return orders.filter(o => {
          if (filterStatus !== 'all' && o.status !== filterStatus) return false;
          if (filterCategory !== 'all' && o.category !== filterCategory) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const clubName = (clubs.find(c => c.id === o.clubId)?.name || '').toLowerCase();
            const match = o.id.toLowerCase().includes(q) ||
                          o.billNo.toLowerCase().includes(q) ||
                          o.event.toLowerCase().includes(q) ||
                          clubName.includes(q);
            if (!match) return false;
          }
          return true;
        });
      }, [orders, filterStatus, filterCategory, searchQuery, clubs]);

      const getOrderPaidTotal = (ordId) => {
        return payments.filter(p => p.orderId === ordId).reduce((s, p) => s + p.amount, 0);
      };

      const handleInitiatePayment = (ord) => {
        const paid = getOrderPaidTotal(ord.id);
        const due = ord.total - paid;
        setPayForm({
          amount: due.toString(),
          mode: 'UPI',
          reference: '',
          date: new Date().toISOString().slice(0, 10),
          note: '',
          error: ''
        });
        setPaymentModalOrder(ord);
      };

      const handleVerifyPaymentDispatch = (e) => {
        e.preventDefault();
        const amt = Number(payForm.amount);
        const paid = getOrderPaidTotal(paymentModalOrder.id);
        const due = paymentModalOrder.total - paid;

        if (isNaN(amt) || amt <= 0) {
          setPayForm(prev => ({ ...prev, error: 'Please enter a positive numeric value.' }));
          return;
        }
        if (amt > due) {
          setPayForm(prev => ({ ...prev, error: `Overpayment Guardrail: Max payable balance is ${formatINR(due)}.` }));
          return;
        }

        onTriggerSecureAction('record_payment', paymentModalOrder, { paymentData: payForm });
        setPaymentModalOrder(null);
      };

      return (
        <div className="space-y-4">
          
          {/* Header Controls */}
          <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-3">
            <div>
              <h2 className="text-sm font-bold text-slate-900">Purchase Orders Registry</h2>
              <p className="text-xs text-slate-500">Live verified orders for stationery, eatables, and event utilities</p>
            </div>
            <div className="flex items-center space-x-2">
              <button
                onClick={onExportCSV}
                className="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl border border-slate-300"
              >
                📥 Export CSV
              </button>
              {['member', 'treasurer'].includes(currentUser.role) && (
                <button
                  onClick={onGoToNew}
                  className="px-3 py-1.5 text-xs font-bold bg-pccoe-600 hover:bg-pccoe-700 text-white rounded-xl shadow-sm"
                >
                  + Raise New PO
                </button>
              )}
            </div>
          </div>

          {/* Filters Bar */}
          <div className="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-2">
            <input
              type="text"
              placeholder="Search by Bill #, PO ID, Team, Event..."
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              className="flex-1 text-xs px-3 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-pccoe-500"
            />
            <select
              value={filterCategory}
              onChange={(e) => setFilterCategory(e.target.value)}
              className="text-xs px-2.5 py-2 border rounded-xl bg-white"
            >
              <option value="all">All Categories</option>
              <option value="Events">Events</option>
              <option value="Marketing & Prints">Marketing & Prints</option>
              <option value="Tech & Equipment">Tech & Equipment</option>
            </select>
            <select
              value={filterStatus}
              onChange={(e) => setFilterStatus(e.target.value)}
              className="text-xs px-2.5 py-2 border rounded-xl bg-white"
            >
              <option value="all">All Statuses</option>
              <option value="Awaiting code">Awaiting Code</option>
              <option value="Authorized">Authorized</option>
              <option value="Partially paid">Partially Paid</option>
              <option value="Paid">Paid in Full</option>
              <option value="Rejected">Rejected</option>
            </select>
          </div>

          {/* Orders Cards Grid */}
          <div className="space-y-3">
            {filtered.map(order => {
              const club = clubs.find(c => c.id === order.clubId);
              const paid = getOrderPaidTotal(order.id);
              const due = Math.max(0, order.total - paid);
              const isHigh = order.total >= highValueThreshold;

              return (
                <div key={order.id} className="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm space-y-3">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-2.5">
                    <div className="flex items-center space-x-2 flex-wrap">
                      <span className="font-mono font-bold text-xs bg-slate-100 text-slate-800 px-2 py-0.5 rounded-lg">
                        {order.id}
                      </span>
                      <span className="text-xs font-bold text-slate-900">{club?.name}</span>
                      
                      {/* Category Badge */}
                      <span className="text-[10px] font-semibold bg-pccoe-50 text-pccoe-700 border border-pccoe-200 px-2 py-0.5 rounded-full">
                        {order.category}
                      </span>

                      {/* Status Badge */}
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                        order.status === 'Paid' ? 'bg-emerald-100 text-emerald-800' :
                        order.status === 'Partially paid' ? 'bg-amber-100 text-amber-800' :
                        order.status === 'Authorized' ? 'bg-blue-100 text-blue-800' :
                        order.status === 'Rejected' ? 'bg-rose-100 text-rose-800' : 'bg-slate-200 text-slate-700'
                      }`}>
                        {order.status}
                      </span>

                      {/* High value anomaly badge */}
                      {isHigh && (
                        <span className="text-[10px] font-bold bg-rose-50 text-rose-600 border border-rose-200 px-1.5 py-0.5 rounded uppercase">
                          ⚠️ High value (&gt; {formatINR(highValueThreshold)})
                        </span>
                      )}

                      {/* Duplicate badge */}
                      {order.flagged && (
                        <span className="text-[10px] font-bold bg-rose-600 text-white px-1.5 py-0.5 rounded">
                          FLAGGED DUPLICATE
                        </span>
                      )}
                    </div>

                    <div className="text-xs text-slate-400">
                      Date: <strong className="text-slate-700">{order.billDate}</strong> | Bill #{' '}
                      <strong className="text-slate-800">{order.billNo}</strong>
                    </div>
                  </div>

                  {order.flagged && (
                    <div className="p-2 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-700 font-medium">
                      🚨 <strong>Guardrail Alert:</strong> {order.flagReason}
                    </div>
                  )}

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                    <div>
                      <span className="text-slate-400 block">Event / Purpose:</span>
                      <span className="font-semibold text-slate-800">{order.event}</span>
                      <span className="text-slate-400 block text-[11px]">Requested: {order.requestedBy}</span>
                    </div>

                    <div>
                      <span className="text-slate-400 block">Line Items:</span>
                      <ul className="text-slate-600 text-[11px] space-y-0.5">
                        {order.items.slice(0, 2).map((it, idx) => (
                          <li key={idx}>• {it.name} ({it.qty} × {formatINR(it.price)})</li>
                        ))}
                      </ul>
                    </div>

                    <div className="md:text-right">
                      <span className="text-slate-400 block">Total Expenditure:</span>
                      <span className="text-base font-black text-pccoe-700">{formatINR(order.total)}</span>
                      {order.status !== 'Awaiting code' && (
                        <div className="text-[11px] text-slate-500 mt-0.5">
                          Paid: <strong className="text-emerald-700">{formatINR(paid)}</strong> | Due: <strong className="text-amber-700">{formatINR(due)}</strong>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Actions Bar */}
                  <div className="pt-2 border-t border-slate-100 flex items-center justify-between">
                    <button
                      onClick={() => onPrintOrder(order)}
                      className="text-xs text-slate-500 hover:text-slate-800 font-semibold"
                    >
                      🖨️ View Voucher
                    </button>

                    <div className="flex items-center space-x-2">
                      {/* Treasurer Approval */}
                      {currentUser.role === 'treasurer' && currentUser.clubId === order.clubId && order.status === 'Awaiting code' && (
                        <>
                          <button
                            onClick={() => onTriggerSecureAction('reject', order)}
                            className="px-2.5 py-1 text-xs font-semibold text-rose-700 bg-rose-50 hover:bg-rose-100 rounded-lg"
                          >
                            Reject
                          </button>
                          <button
                            onClick={() => onTriggerSecureAction('authorize', order)}
                            className="px-3 py-1 text-xs font-bold bg-pccoe-600 hover:bg-pccoe-700 text-white rounded-lg shadow-sm"
                          >
                            Authorize PO &rarr;
                          </button>
                        </>
                      )}

                      {/* Payment Trigger */}
                      {['treasurer', 'shopkeeper'].includes(currentUser.role) && ['Authorized', 'Partially paid'].includes(order.status) && (
                        <button
                          onClick={() => handleInitiatePayment(order)}
                          className="px-3 py-1 text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg shadow-sm"
                        >
                          Record Payment ({formatINR(due)} due)
                        </button>
                      )}
                    </div>
                  </div>

                </div>
              );
            })}
          </div>

          {/* RECORD PAYMENT MODAL */}
          {paymentModalOrder && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
                <div className="flex justify-between items-center pb-3 border-b">
                  <h3 className="text-sm font-bold text-slate-900">Record Payment for {paymentModalOrder.id}</h3>
                  <button onClick={() => setPaymentModalOrder(null)} className="text-slate-400 text-xl font-bold">&times;</button>
                </div>

                <form onSubmit={handleVerifyPaymentDispatch} className="space-y-3 mt-4 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Amount to Settle (INR) *</label>
                    <input
                      type="number"
                      required
                      min={1}
                      max={paymentModalOrder.total - getOrderPaidTotal(paymentModalOrder.id)}
                      value={payForm.amount}
                      onChange={(e) => setPayForm(prev => ({ ...prev, amount: e.target.value, error: '' }))}
                      className="w-full p-2.5 border rounded-xl font-bold text-sm focus:outline-none focus:ring-2 focus:ring-pccoe-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Mode *</label>
                      <select
                        value={payForm.mode}
                        onChange={(e) => setPayForm(prev => ({ ...prev, mode: e.target.value }))}
                        className="w-full p-2 border rounded-xl bg-white"
                      >
                        <option value="UPI">Official Campus UPI</option>
                        <option value="Cash">Cash at Store Desk</option>
                        <option value="Bank transfer">IMPS / NEFT</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Payment Date *</label>
                      <input
                        type="date"
                        required
                        value={payForm.date}
                        onChange={(e) => setPayForm(prev => ({ ...prev, date: e.target.value }))}
                        className="w-full p-2 border rounded-xl bg-white"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Transaction Ref / UTR *</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. UPI/PCCOE/20260928/19482"
                      value={payForm.reference}
                      onChange={(e) => setPayForm(prev => ({ ...prev, reference: e.target.value }))}
                      className="w-full p-2 border rounded-xl font-mono"
                    />
                  </div>

                  {payForm.error && (
                    <div className="p-2 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl font-medium">
                      ⚠️ {payForm.error}
                    </div>
                  )}

                  <div className="flex space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setPaymentModalOrder(null)}
                      className="flex-1 py-2 border rounded-xl text-slate-700 font-semibold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow"
                    >
                      Verify Passcode &rarr;
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>

    // -------------------------------------------------------------
    // 4.2: NEW ORDER FORM
    // -------------------------------------------------------------
    function NewOrderForm({ clubs, currentUser, onSubmitOrder, onCancel }) {
      const defaultClub = currentUser.clubId || clubs[0]?.id || 'automatons';
      const [clubId, setClubId] = useState(defaultClub);
      const [subClub, setSubClub] = useState('');
      const [category, setCategory] = useState('Tech & Equipment');
      const [requestedBy, setRequestedBy] = useState(currentUser.name);
      const [event, setEvent] = useState('');
      const [billNo, setBillNo] = useState('');
      const [billDate, setBillDate] = useState(new Date().toISOString().slice(0, 10));

      const [items, setItems] = useState([
        { name: 'Hardware Wires & Tapes', qty: 4, price: 120 },
        { name: 'Refreshment Packets', qty: 20, price: 30 }
      ]);

      const selectedClub = useMemo(() => clubs.find(c => c.id === clubId), [clubs, clubId]);

      const total = useMemo(() => {
        return items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
      }, [items]);

      const handleAddItem = () => setItems([...items, { name: '', qty: 1, price: 0 }]);
      const handleRemoveItem = (idx) => {
        if (items.length > 1) setItems(items.filter((_, i) => i !== idx));
      };
      const handleItemChange = (idx, field, val) => {
        const copy = [...items];
        copy[idx][field] = field === 'name' ? val : Number(val);
        setItems(copy);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const today = new Date().toISOString().slice(0, 10);
        if (billDate > today) {
          alert("Validation Guardrail: Bill date cannot be in the future.");
          return;
        }

        onSubmitOrder({
          clubId,
          subClub: selectedClub?.type === 'major' ? subClub : '',
          category,
          requestedBy: sanitize(requestedBy),
          event: sanitize(event),
          billNo: sanitize(billNo).toUpperCase(),
          billDate,
          items: items.map(it => ({ name: sanitize(it.name), qty: Number(it.qty), price: Number(it.price) })),
          total
        });
      };

      return (
        <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm max-w-3xl mx-auto space-y-4">
          <div className="border-b pb-3">
            <h2 className="text-sm font-bold text-slate-900">Raise New Purchase Request</h2>
            <p className="text-xs text-slate-500">
              Orders enter Campus Vault as <strong className="text-slate-700">"Awaiting treasurer code"</strong> and are never counted against budget until authenticated.
            </p>
          </div>

          <form onSubmit={handleSubmit} className="space-y-4 text-xs">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label className="block font-semibold text-slate-700 mb-1">Club / Department *</label>
                <select
                  disabled={Boolean(currentUser.clubId)}
                  value={clubId}
                  onChange={(e) => setClubId(e.target.value)}
                  className="w-full p-2.5 border rounded-xl bg-white disabled:bg-slate-100"
                >
                  {clubs.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Budget Category (Image 2) *</label>
                <select
                  value={category}
                  onChange={(e) => setCategory(e.target.value)}
                  className="w-full p-2.5 border rounded-xl bg-white font-medium text-pccoe-700"
                >
                  <option value="Events">Events</option>
                  <option value="Marketing & Prints">Marketing & Prints</option>
                  <option value="Tech & Equipment">Tech & Equipment</option>
                </select>
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label className="block font-semibold text-slate-700 mb-1">Requested By *</label>
                <input
                  type="text"
                  required
                  value={requestedBy}
                  onChange={(e) => setRequestedBy(e.target.value)}
                  className="w-full p-2.5 border rounded-xl"
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Event / Milestone Purpose *</label>
                <input
                  type="text"
                  required
                  placeholder="e.g. Supra SAE Brake Pad Testing"
                  value={event}
                  onChange={(e) => setEvent(e.target.value)}
                  className="w-full p-2.5 border rounded-xl"
                />
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label className="block font-semibold text-slate-700 mb-1">Shop Physical Bill Number *</label>
                <input
                  type="text"
                  required
                  placeholder="e.g. SHP-9821"
                  value={billNo}
                  onChange={(e) => setBillNo(e.target.value)}
                  className="w-full p-2.5 border rounded-xl font-mono uppercase"
                />
                <p className="text-[10px] text-slate-400 mt-0.5">Scanned for duplicate collisions across campus records.</p>
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Bill Date *</label>
                <input
                  type="date"
                  required
                  value={billDate}
                  onChange={(e) => setBillDate(e.target.value)}
                  className="w-full p-2.5 border rounded-xl"
                />
              </div>
            </div>

            {/* Line Items */}
            <div className="p-3 bg-slate-50 border rounded-2xl space-y-2">
              <div className="flex justify-between items-center">
                <span className="font-bold text-slate-800">Stationery & Refreshment Items</span>
                <button
                  type="button"
                  onClick={handleAddItem}
                  className="px-2 py-1 bg-white border text-pccoe-600 font-bold rounded-lg text-xs"
                >
                  + Add Item
                </button>
              </div>

              {items.map((it, idx) => (
                <div key={idx} className="flex gap-2 items-center">
                  <input
                    type="text"
                    placeholder="Description"
                    value={it.name}
                    onChange={(e) => handleItemChange(idx, 'name', e.target.value)}
                    className="flex-3 w-full p-2 border rounded-lg bg-white"
                  />
                  <input
                    type="number"
                    min={1}
                    value={it.qty}
                    onChange={(e) => handleItemChange(idx, 'qty', e.target.value)}
                    className="w-16 p-2 border rounded-lg bg-white text-center"
                  />
                  <input
                    type="number"
                    min={0}
                    value={it.price}
                    onChange={(e) => handleItemChange(idx, 'price', e.target.value)}
                    className="w-24 p-2 border rounded-lg bg-white text-right"
                  />
                  <div className="w-24 text-right font-bold text-slate-800">
                    {formatINR((it.qty || 0) * (it.price || 0))}
                  </div>
                  {items.length > 1 && (
                    <button type="button" onClick={() => handleRemoveItem(idx)} className="text-rose-500 font-bold px-1.5">✕</button>
                  )}
                </div>
              ))}

              <div className="pt-2 border-t flex justify-between font-bold text-sm">
                <span>Total PO Amount:</span>
                <span className="text-pccoe-700">{formatINR(total)}</span>
              </div>
            </div>

            <div className="flex space-x-3 pt-2">
              <button
                type="button"
                onClick={onCancel}
                className="w-1/3 py-2.5 border rounded-xl font-bold text-slate-700 hover:bg-slate-50"
              >
                Cancel
              </button>
              <button
                type="submit"
                className="w-2/3 py-2.5 bg-pccoe-600 hover:bg-pccoe-700 text-white font-bold rounded-xl shadow-md"
              >
                Submit Purchase Request &rarr;
              </button>
            </div>
          </form>
        </div>
      );
    }

                      <td className="p-3 font-sans font-semibold text-slate-800">{log.actor}</td>
                      <td className="p-3">
                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold font-sans ${
                          log.action === 'ORDER_AUTHORIZED' ? 'bg-blue-100 text-blue-800' :
                          log.action === 'PAYMENT_RECORDED' ? 'bg-emerald-100 text-emerald-800' :
                          log.action === 'CLUB_LOCKED' ? 'bg-rose-600 text-white' : 'bg-slate-200 text-slate-700'
                        }`}>
                          {log.action}
                        </span>
                      </td>
                      <td className="p-3 text-slate-700">{log.entity} #{log.entityId}</td>
                      <td className="p-3 font-sans text-slate-700">{log.details}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // Render into Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CampusVaultApp />);
  </script>
</body>
</html>
