    // Compute SHA-256 hash using browser native Web Crypto API
    async function sha256(text) {
      const msgBuffer = new TextEncoder().encode(text.trim());
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    /**
     * Pluggable verification function for Treasurer authentication.
     * Note for Production / Faculty Architecture:
     * -------------------------------------------------------------
     * In an enterprise/campus deployment, this function can be replaced 
     * by an API call requesting or validating an SMS / WhatsApp OTP:
     * e.g.,
     *   const res = await fetch(`/api/auth/otp/verify`, {
     *      method: 'POST',
     *      body: JSON.stringify({ clubId, otp: inputCode })
     *   });
     *   return res.ok;
     * -------------------------------------------------------------
     */
    async function verifyTreasurerCode(club, inputCode) {
      if (!club || !inputCode) return false;
      if (club.locked) return false;
      const inputHash = await sha256(inputCode);
      return inputHash === club.codeHash;
    }

        const newTotal = Number(newOrder.total);
        const newItemsStr = newOrder.items.map(i => `${sanitize(i.name).toLowerCase()}:${i.qty}:${i.price}`).sort().join('|');

        for (const o of orders) {
          // Rule A: Shop Bill Number collision (case/space/symbol insensitive)
          if (normNewBill && normalizeBillNo(o.billNo) === normNewBill) {
            return `Duplicate Bill Number: "${newOrder.billNo}" matches existing Order #${o.id} (${o.clubId.toUpperCase()})`;
          }

          // Rule B: Same club + Same total + Same bill date
          if (o.clubId === newOrder.clubId && Number(o.total) === newTotal && o.billDate === newOrder.billDate) {
            return `Identical Expense: Same club (${o.clubId.toUpperCase()}) already submitted bill with identical total of ${formatINR(newTotal)} on ${o.billDate}`;
          }

          // Rule C: Same club + Same item list + Same total within 3 days
          if (o.clubId === newOrder.clubId && Number(o.total) === newTotal) {
            const existingDate = new Date(o.billDate);
            const diffDays = Math.abs(newDate - existingDate) / (1000 * 60 * 60 * 24);
            if (diffDays <= 3) {
              const existingItemsStr = o.items.map(i => `${sanitize(i.name).toLowerCase()}:${i.qty}:${i.price}`).sort().join('|');
              if (newItemsStr === existingItemsStr) {
                return `Redundant Purchase: Identical line items and total submitted within 3 days of Order #${o.id}`;
              }
            }
          }
        }
        return null;
      };

      // -------------------------------------------------------------
      // ORDER CREATION HANDLER
      // -------------------------------------------------------------
      const handleCreateOrder = (orderData) => {
        const newId = `ORD-2026-${String(orders.length + 1).padStart(3, '0')}`;
        const dupReason = checkDuplicateHeuristics(orderData);
        const isFlagged = Boolean(dupReason);

        const newOrder = {
          ...orderData,
          id: newId,
          status: 'Awaiting code',
          flagged: isFlagged,
          flagReason: dupReason || '',
          createdAt: new Date().toISOString()
        };

        setOrders(prev => [newOrder, ...prev]);

        // If duplicate detected, generate security flag entry
        if (isFlagged) {
          const newFlag = {
            id: `FLG-${Date.now().toString().slice(-4)}`,
            orderId: newId,
            clubId: orderData.clubId,
            reason: dupReason,
            status: 'pending',
            createdAt: new Date().toISOString(),
            reviewedBy: null,
            reviewedAt: null
          };
          setFlags(prev => [newFlag, ...prev]);
          appendAudit(
            `${orderData.requestedBy} (Member)`,
            'DUPLICATE_FLAGGED',
            'Order',
            newId,
            dupReason
          );
        }

        appendAudit(
          `${orderData.requestedBy} (Member)`,
          'ORDER_CREATED',
          'Order',
          newId,
          `Raised for ${orderData.event} (${formatINR(orderData.total)})${isFlagged ? ' [FLAGGED AS POTENTIAL DUPLICATE]' : ''}`
        );

        showToast(
          isFlagged 
            ? `Order raised with warning: Potential duplicate detected!` 
            : `Order ${newId} created successfully. Awaiting treasurer authorization.`,
          isFlagged ? 'warning' : 'success'
        );
        setActiveTab('orders');
      };

      // -------------------------------------------------------------
      // SECURITY VERIFICATION DISPATCHER
      // -------------------------------------------------------------
      const handleOpenAuthModal = (actionType, order, extraData = {}) => {
        const club = clubs.find(c => c.id === order.clubId);
        if (!club) return;
        if (club.locked) {
          alert(`Club ${club.name} approval authority is LOCKED due to 3 repeated wrong security codes. Contact Faculty Admin to unlock.`);
          return;
        }

        setAuthModal({
          isOpen: true,
          actionType,
          targetOrder: order,
          targetPaymentData: extraData.paymentData || null,
          targetFlag: extraData.flag || null,
          decision: extraData.decision || null,
          inputCode: '',
          errorMessage: ''
        });
      };

      const handleExecuteSecureAction = async (e) => {
        e.preventDefault();
        const { actionType, targetOrder, targetPaymentData, targetFlag, decision, inputCode } = authModal;
        const club = clubs.find(c => c.id === targetOrder.clubId);

        if (!club) return;

        // Perform SHA-256 verification via pluggable security routine
        const isMatch = await verifyTreasurerCode(club, inputCode);

        if (!isMatch) {
          const updatedAttempts = (club.failedAttempts || 0) + 1;
          const isNowLocked = updatedAttempts >= 3;
          const remaining = 3 - updatedAttempts;

          // Update club lock status in store
          setClubs(prev => prev.map(c => {
            if (c.id === club.id) {
              return {
                ...c,
                failedAttempts: updatedAttempts,
                locked: isNowLocked,
                status: isNowLocked ? 'locked' : c.status
              };
            }
            return c;
          }));

          // Log security breach attempt
          appendAudit(
            'Security System',
            isNowLocked ? 'CLUB_LOCKED' : 'FAILED_CODE_ATTEMPT',
            'Club',
            club.id,
            `Failed treasurer code attempt #${updatedAttempts} for ${club.name}. ${isNowLocked ? 'APPROVALS LOCKED! Contact Admin.' : `${remaining} attempts remaining.`}`
          );

          if (isNowLocked) {
            setAuthModal(prev => ({ ...prev, isOpen: false }));
            alert(`SECURITY ALERT: 3 incorrect codes entered. Club "${club.name}" approvals are now LOCKED. Only Faculty Admin can reset this.`);
          } else {
            setAuthModal(prev => ({
              ...prev,
              errorMessage: `Invalid code. ${remaining} attempt${remaining === 1 ? '' : 's'} remaining before lock!`
            }));
          }
          return;
        }

        // If verification succeeded: Reset failed attempts back to zero
        setClubs(prev => prev.map(c => c.id === club.id ? { ...c, failedAttempts: 0 } : c));

        // EXECUTE RESPECTIVE ACTION
        if (actionType === 'authorize') {
          setOrders(prev => prev.map(o => o.id === targetOrder.id ? { ...o, status: 'Authorized' } : o));
          appendAudit(
            `${club.treasurerName} (Treasurer)`,
            'ORDER_AUTHORIZED',
            'Order',
            targetOrder.id,
            `Authorized purchase order of ${formatINR(targetOrder.total)}`
          );
          showToast(`Order ${targetOrder.id} authorized. Added to active ledger.`, 'success');
        } 
        else if (actionType === 'reject') {
          setOrders(prev => prev.map(o => o.id === targetOrder.id ? { ...o, status: 'Rejected' } : o));
          appendAudit(
            `${club.treasurerName} (Treasurer)`,
            'ORDER_REJECTED',
            'Order',
            targetOrder.id,
            `Rejected purchase order of ${formatINR(targetOrder.total)}`
          );
          showToast(`Order ${targetOrder.id} rejected.`, 'info');
        } 
        else if (actionType === 'record_payment') {
          const payAmount = Number(targetPaymentData.amount);
          const payId = `PAY-${Date.now().toString().slice(-4)}`;
          
          const newPayment = {
            id: payId,
            orderId: targetOrder.id,
            clubId: targetOrder.clubId,
            amount: payAmount,
            mode: targetPaymentData.mode,
            reference: targetPaymentData.reference || 'N/A',
            date: targetPaymentData.date,
            note: targetPaymentData.note || '',
            recordedBy: club.treasurerName
          };

          // Compute new status with this payment
          const existingPaid = payments
            .filter(p => p.orderId === targetOrder.id)
            .reduce((sum, p) => sum + p.amount, 0);
          const totalPaidAfter = existingPaid + payAmount;
          const nextStatus = totalPaidAfter >= targetOrder.total ? 'Paid' : 'Partially paid';

          setPayments(prev => [newPayment, ...prev]);
          setOrders(prev => prev.map(o => o.id === targetOrder.id ? { ...o, status: nextStatus } : o));
          
          appendAudit(
            `${club.treasurerName} (Treasurer)`,
            'PAYMENT_RECORDED',
            'Payment',
            payId,
            `Recorded payment of ${formatINR(payAmount)} for Order #${targetOrder.id} (${nextStatus})`
          );
          showToast(`Payment of ${formatINR(payAmount)} recorded. Order status: ${nextStatus}.`, 'success');
        }
        else if (actionType === 'review_flag') {
          // Review flag with treasurer approval
          setFlags(prev => prev.map(f => f.id === targetFlag.id ? {
            ...f,
            status: decision,
            reviewedBy: `${club.treasurerName} (Treasurer)`,
            reviewedAt: new Date().toISOString()
          } : f));

          if (decision === 'confirmed_duplicate') {
            // Cancel order through reversal entry
            setOrders(prev => prev.map(o => o.id === targetOrder.id ? { ...o, status: 'Rejected', flagged: true, flagReason: 'Confirmed Duplicate (Voided)' } : o));
            appendAudit(
              `${club.treasurerName} (Treasurer)`,
              'REVERSAL_ENTRY',
              'Order',
              targetOrder.id,
              `Confirmed duplicate flag: voided order total ${formatINR(targetOrder.total)} via reversal.`
            );
          } else {
            appendAudit(
              `${club.treasurerName} (Treasurer)`,
              'FLAG_RESOLVED_VALID',
              'Flag',
              targetFlag.id,
              `Flag cleared as valid purchase by treasurer.`
            );
          }
          showToast(`Flag marked as "${decision === 'confirmed_duplicate' ? 'Confirmed Duplicate' : 'Reviewed: Valid'}"`, 'info');
        }

        setAuthModal(prev => ({ ...prev, isOpen: false, inputCode: '', errorMessage: '' }));
      };

      // -------------------------------------------------------------
      // ADMIN UNLOCK ACTION
      // -------------------------------------------------------------
      const handleAdminUnlockClub = (clubId) => {
        const club = clubs.find(c => c.id === clubId);
        if (!club) return;
        setClubs(prev => prev.map(c => c.id === clubId ? { ...c, locked: false, failedAttempts: 0, status: 'active' } : c));

        showToast(`Security lock cleared for ${club.name}. Approvals re-enabled.`, 'success');

      // Admin direct flag review (Admin has authority without code)
      const handleAdminReviewFlag = (flag, decision) => {
        setFlags(prev => prev.map(f => f.id === flag.id ? {

        const order = orders.find(o => o.id === flag.orderId);

          setOrders(prev => prev.map(o => o.id === order.id ? { ...o, status: 'Rejected', flagReason: 'Confirmed Duplicate by Admin' } : o));
          appendAudit('Faculty Coordinator (Admin)', 'REVERSAL_ENTRY', 'Order', order.id, `Confirmed duplicate flag: voided order total ${formatINR(order.total)} via reversal.`);
        } else {
          appendAudit('Faculty Coordinator (Admin)', 'FLAG_RESOLVED_VALID', 'Flag', flag.id, `Flag cleared as genuine purchase.`);
        }
        showToast(`Flag updated to: ${decision}`, 'info');
      };

      // -------------------------------------------------------------
      // CSV EXPORT GENERATOR
      // -------------------------------------------------------------
      const handleExportCSV = (datasetType) => {
        let headers = [];
        let rows = [];
        let filename = `CampusLedger_${datasetType}_${new Date().toISOString().slice(0, 10)}.csv`;

        if (datasetType === 'orders') {
          headers = ['Order ID', 'Club', 'Sub-Club', 'Requested By', 'Event', 'Bill No', 'Bill Date', 'Total (INR)', 'Status', 'Flagged'];
          rows = orders.map(o => [
            o.id,
            o.clubId.toUpperCase(),
            o.subClub || 'N/A',
            `"${o.requestedBy}"`,
            `"${o.event}"`,
            o.billNo,
            o.billDate,
            o.total,
            o.status,
            o.flagged ? `YES: ${o.flagReason}` : 'NO'
          ]);
        } else if (datasetType === 'payments') {
          headers = ['Payment ID', 'Order ID', 'Club', 'Amount (INR)', 'Mode', 'Reference', 'Date', 'Recorded By'];
          rows = payments.map(p => [
            p.id,
            p.orderId,
            p.clubId.toUpperCase(),
            p.amount,
            p.mode,
            `"${p.reference}"`,
            p.date,
            `"${p.recordedBy}"`
          ]);
        }

        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // -------------------------------------------------------------
      // CALCULATIONS & DERIVED METRICS
      // -------------------------------------------------------------
      // Club Ledger calculations (Authorized only count towards spend)
      const clubLedgers = useMemo(() => {
        return clubs.map(club => {
          const clubOrders = orders.filter(o => o.clubId === club.id);
          const authorizedOrders = clubOrders.filter(o => o.status === 'Authorized' || o.status === 'Partially paid' || o.status === 'Paid');
          const spent = authorizedOrders.reduce((sum, o) => sum + Number(o.total), 0);
          
          const clubPayments = payments.filter(p => p.clubId === club.id);
          const paid = clubPayments.reduce((sum, p) => sum + Number(p.amount), 0);
          
          const pending = Math.max(0, spent - paid);
          const remaining = club.annualBudget - spent;
          const percentSpent = club.annualBudget > 0 ? (spent / club.annualBudget) * 100 : 0;

          return {
            ...club,
            spent,
            paid,
            pending,
            remaining,
            percentSpent,
            authorizedCount: authorizedOrders.length,
            pendingOrdersCount: clubOrders.filter(o => o.status === 'Awaiting code').length
          };
        });
      }, [clubs, orders, payments]);

      // Global Campus Totals
      const globalStats = useMemo(() => {
        const totalBudget = clubs.reduce((acc, c) => acc + c.annualBudget, 0);
        const totalSpent = clubLedgers.reduce((acc, c) => acc + c.spent, 0);
        const totalPaid = payments.reduce((acc, p) => acc + p.amount, 0);
        const totalPendingToShop = Math.max(0, totalSpent - totalPaid);
        const flaggedCount = flags.filter(f => f.status === 'pending').length;
        const lockedClubsCount = clubs.filter(c => c.locked).length;

        // Top 5 Spenders
        const top5Spenders = [...clubLedgers].sort((a, b) => b.spent - a.spent).slice(0, 5);

        return {
          totalBudget,
          totalSpent,
          totalPaid,
          totalPendingToShop,
          flaggedCount,
          lockedClubsCount,
          top5Spenders
        };
      }, [clubs, clubLedgers, payments, flags]);

      // Filtered orders based on selected role
      const visibleOrders = useMemo(() => {
        if (role === 'treasurer') {
          return orders.filter(o => o.clubId === selectedTreasurerClubId);
        }
        return orders;
      }, [orders, role, selectedTreasurerClubId]);

      // Active Treasurer Club object
      const currentTreasurerClub = useMemo(() => {
        return clubs.find(c => c.id === selectedTreasurerClubId);
      }, [clubs, selectedTreasurerClubId]);

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800">
          
          {/* TOAST ALERTS */}
          {toast && (
            <div className="fixed top-4 right-4 z-50 transition-all transform animate-bounce">
              <div className={`px-4 py-3 rounded-lg shadow-lg flex items-center space-x-3 text-sm font-medium ${
                toast.type === 'success' ? 'bg-emerald-600 text-white' :
                toast.type === 'warning' ? 'bg-amber-500 text-slate-950' :
                toast.type === 'error' ? 'bg-rose-600 text-white' : 'bg-slate-800 text-white'
              }`}>
                <span>{toast.message}</span>
              </div>
            </div>
          )}

          {/* APP HEADER & ROLE SWITCHER */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm no-print">
            <div className="max-w-7xl mx-auto px-4 py-3 sm:px-6 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
              <div className="flex items-center justify-between">
                <div className="flex items-center space-x-2">
                  <div className="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold shadow-md">
                    CL
                  </div>
                  <div>
                    <h1 className="text-lg font-bold text-slate-900 leading-tight">Campus Ledger</h1>
                    <p className="text-xs text-slate-500">Designated Stationery & Eatables Shop Portal</p>
                  </div>
                </div>

                {/* Mobile Reset & Demo Toggle */}
                <div className="flex md:hidden items-center space-x-2">
                  <button 
                    onClick={handleResetDemoData}
                    className="text-xs px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded text-slate-700"
                    title="Reset all demo data"
                  >
                    Reset
                  </button>
                </div>
              </div>

              {/* Role Selector Controls */}
              <div className="flex flex-wrap items-center gap-2">
                <div className="flex items-center bg-slate-100 p-1 rounded-lg text-xs font-medium">
                  <span className="text-slate-500 px-2 font-semibold">Role:</span>
                  {[
                    { id: 'member', label: 'Club Member' },
                    { id: 'treasurer', label: 'Treasurer' },
                    { id: 'shopkeeper', label: 'Shopkeeper' },
                    { id: 'admin', label: 'Faculty / Admin' }
                  ].map(r => (
                    <button
                      key={r.id}
                      onClick={() => setRole(r.id)}
                      className={`px-2.5 py-1 rounded-md transition-all ${
                        role === r.id 
                          ? 'bg-white text-indigo-700 shadow-sm font-bold' 
                          : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      {r.label}
                    </button>
                  ))}

                {/* If Treasurer role is active, show club picker */}
                {role === 'treasurer' && (

                    <label htmlFor="treasurerClubSelect" className="text-xs text-indigo-800 font-semibold">Club:</label>
                    <select

                {/* Demo Helper: Show Plain Codes */}
                <button

                    demoShowCodes

                  title="Toggle visible passcodes for testing ease"

                </button>

                <button

                  className="hidden md:inline-flex text-xs px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg border border-slate-200"
                >
                  Reset Demo
                </button>

            </div>

            {/* DEMO CODES BANNER (When Enabled) */}
            {demoShowCodes && (

                {role === 'treasurer' && currentTreasurerClub ? (
                  <span>
                    Current Club (<strong>{currentTreasurerClub.name}</strong>): code is <code className="bg-amber-200 px-1 py-0.5 rounded font-mono font-bold text-amber-950">{currentTreasurerClub.plainCode}</code>
                  </span>
                ) : (
                  <span>
                    AIMSA: <code>1111</code> | CESA: <code>2222</code> | IEEE: <code>9999</code> | GDGC: <code>1212</code> | Automatons: <code>4545</code>
                  </span>
                )}
                <span className="text-amber-700 italic ml-auto">(Stored as SHA-256 in store; simulated via Web Crypto)</span>
              </div>
            )}
          </header>

          {/* MAIN WORKSPACE LAYOUT */}
          <div className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 flex flex-col md:flex-row gap-6">
            
            {/* SIDEBAR NAVIGATION (Desktop) */}
            <aside className="w-full md:w-56 shrink-0 hidden md:block no-print">
              <nav className="sticky top-20 space-y-1 bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                <div className="px-3 py-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                  Menu
                </div>

                <button
                  onClick={() => setActiveTab('orders')}
                  className={`w-full flex items-center justify-between px-3 py-2 text-sm rounded-lg font-medium transition ${
                    activeTab === 'orders' ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:bg-slate-100'
                  }`}
                >
                  <span>📦 Orders & Bills</span>
                  <span className="text-xs bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded-full">{orders.length}</span>
                </button>

                <button
                  onClick={() => setActiveTab('new-order')}
                  className={`w-full flex items-center justify-between px-3 py-2 text-sm rounded-lg font-medium transition ${

                  <span className="text-xs text-slate-400">{clubs.length}</span>

                  </button>
                )}

                  </div>
                </div>

                {/* Printable Order Bill */}
                {printPreview.type === 'order' && (

                    <div className="border-b pb-4 text-center">

                        {printPreview.data.subClub && <p className="text-slate-600">Sub-club: {printPreview.data.subClub}</p>}

    // =========================================================================
    // SECTION 4: SUB-VIEWS & MODULAR COMPONENTS
