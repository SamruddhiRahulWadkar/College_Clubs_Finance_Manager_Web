    // -------------------------------------------------------------
    // 4.1: ORDERS LIST VIEW & PAYMENT MODAL DISPATCH
    // -------------------------------------------------------------
    function OrdersView({ 
      orders, 
      clubs, 
      payments, 
      role, 
      selectedTreasurerClubId, 
      highValueThreshold,
      onOpenAuthModal, 
      onPrintOrder, 
      onExportCSV,
      onGoToNewOrder 
    }) {
      const [filterStatus, setFilterStatus] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedClubFilter, setSelectedClubFilter] = useState('all');
      const [paymentModalOrder, setPaymentModalOrder] = useState(null);

      // Payment Modal Form State
      const [paymentForm, setPaymentForm] = useState({
        amount: '',
        mode: 'UPI',
        reference: '',
        date: new Date().toISOString().slice(0, 10),
        note: '',
        error: ''
      });

      const filteredOrders = useMemo(() => {
        return orders.filter(o => {
          if (filterStatus !== 'all' && o.status !== filterStatus) return false;
          if (role !== 'treasurer' && selectedClubFilter !== 'all' && o.clubId !== selectedClubFilter) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const clubName = (clubs.find(c => c.id === o.clubId)?.name || '').toLowerCase();
            const matchesText = o.id.toLowerCase().includes(q) ||
                                o.billNo.toLowerCase().includes(q) ||
                                o.event.toLowerCase().includes(q) ||
                                o.requestedBy.toLowerCase().includes(q) ||
                                clubName.includes(q);
            if (!matchesText) return false;
          }
          return true;
        });
      }, [orders, filterStatus, selectedClubFilter, searchQuery, clubs, role]);

      // Calculate paid amount per order
      const getOrderPaymentSummary = (orderId) => {
        const orderPays = payments.filter(p => p.orderId === orderId);
        const totalPaid = orderPays.reduce((sum, p) => sum + p.amount, 0);
        return { totalPaid, count: orderPays.length };
      };

      const handleStartPayment = (order) => {
        const { totalPaid } = getOrderPaymentSummary(order.id);
        const balance = Math.max(0, order.total - totalPaid);
        setPaymentForm({
          amount: balance.toString(),
          mode: 'UPI',
          reference: '',
          date: new Date().toISOString().slice(0, 10),
          note: '',
          error: ''
        });
        setPaymentModalOrder(order);
      };

      const handleSubmitPaymentForm = (e) => {
        e.preventDefault();
        const amt = Number(paymentForm.amount);
        const { totalPaid } = getOrderPaymentSummary(paymentModalOrder.id);
        const balance = paymentModalOrder.total - totalPaid;

        if (isNaN(amt) || amt <= 0) {
          setPaymentForm(prev => ({ ...prev, error: 'Please enter a valid positive payment amount.' }));
          return;
        }
        if (amt > balance) {
          setPaymentForm(prev => ({ ...prev, error: `Overpayment rejected! Maximum outstanding balance is ${formatINR(balance)}.` }));
          return;
        }

        // Open secure authorization modal for treasurer pass-code verification
        onOpenAuthModal('record_payment', paymentModalOrder, { paymentData: paymentForm });
        setPaymentModalOrder(null);
      };

      return (
        <div className="space-y-4">
          
          {/* Header Banner & Filters */}
          <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div>
              <h2 className="text-base font-bold text-slate-900">Purchase Orders & Bills</h2>
              <p className="text-xs text-slate-500">
                {role === 'treasurer' 
                  ? `Showing orders strictly for ${clubs.find(c => c.id === selectedTreasurerClubId)?.name}` 
                  : 'Centralized registry of all department & community expense requests'}
              </p>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={onExportCSV}
                className="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg border border-slate-300 flex items-center space-x-1"
              >
                <span>📥 Export CSV</span>
              </button>
              <button
                onClick={onGoToNewOrder}
                className="px-3 py-1.5 text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow-sm flex items-center space-x-1"
              >
                <span>+ Raise New PO</span>
              </button>
            </div>
          </div>

          {/* Search & Filter Controls */}
          <div className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-3">
            <div className="flex-1 relative">
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search by Bill #, PO ID, Club, Event, or Name..."
                className="w-full text-xs pl-8 pr-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
              />
              <span className="absolute left-2.5 top-2.5 text-slate-400 text-xs">🔍</span>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              {role !== 'treasurer' && (
                <select
                  value={selectedClubFilter}
                  onChange={(e) => setSelectedClubFilter(e.target.value)}
                  className="text-xs py-2 px-2.5 border border-slate-300 rounded-lg bg-white text-slate-700 focus:outline-none"
                >
                  <option value="all">All Clubs ({clubs.length})</option>
                  {clubs.map(c => (
                    <option key={c.id} value={c.id}>{c.name}</option>
                  ))}
                </select>
              )}

              <select
                value={filterStatus}
                onChange={(e) => setFilterStatus(e.target.value)}
                className="text-xs py-2 px-2.5 border border-slate-300 rounded-lg bg-white text-slate-700 focus:outline-none"
              >
                <option value="all">All Statuses</option>
                <option value="Awaiting code">Awaiting Code</option>
                <option value="Authorized">Authorized (Pending Pay)</option>
                <option value="Partially paid">Partially Paid</option>
                <option value="Paid">Paid in Full</option>
                <option value="Rejected">Rejected</option>
              </select>
            </div>
          </div>

          {/* ORDERS TABLE / CARD FEED */}
          {filteredOrders.length === 0 ? (
            <div className="bg-white p-8 rounded-xl border border-slate-200 text-center space-y-2">
              <span className="text-3xl">📭</span>
              <h3 className="text-sm font-bold text-slate-700">No matching orders found</h3>
              <p className="text-xs text-slate-400">Try adjusting your filters or search terms.</p>
              <button
                onClick={onGoToNewOrder}
                className="mt-2 text-xs font-semibold text-indigo-600 hover:underline"
              >
                Raise a new order now &rarr;
              </button>
            </div>
          ) : (
            <div className="space-y-3">
              {filteredOrders.map(order => {
                const club = clubs.find(c => c.id === order.clubId);
                const { totalPaid } = getOrderPaymentSummary(order.id);
                const balance = Math.max(0, order.total - totalPaid);
                const isHighValue = order.total >= highValueThreshold;

                return (
                  <div 
                    key={order.id} 
                    className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm hover:border-slate-300 transition space-y-3"
                  >
                    {/* Header Row */}
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-3">
                      <div className="flex items-center space-x-2 flex-wrap">
                        <span className="font-mono font-bold text-xs bg-slate-100 text-slate-800 px-2 py-0.5 rounded">
                          {order.id}
                        </span>
                        <span className="text-xs font-bold text-slate-900">{club?.name}</span>
                        {order.subClub && (
                          <span className="text-[11px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded">
                            {order.subClub}
                          </span>
                        )}

                        {/* STATUS BADGE */}
                        <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full ${
                          order.status === 'Paid' ? 'bg-emerald-100 text-emerald-800' :
                          order.status === 'Partially paid' ? 'bg-amber-100 text-amber-800' :
                          order.status === 'Authorized' ? 'bg-blue-100 text-blue-800' :
                          order.status === 'Rejected' ? 'bg-rose-100 text-rose-800' :
                          'bg-slate-200 text-slate-700'
                        }`}>
                          {order.status === 'Authorized' ? 'Authorized (Pending Pay)' : order.status}
                        </span>

                        {/* HIGH VALUE ANOMALY BADGE */}
                        {isHighValue && (
                          <span className="text-[10px] font-bold bg-rose-50 text-rose-600 border border-rose-200 px-1.5 py-0.5 rounded uppercase">
                            ⚠️ High value (&gt; {formatINR(highValueThreshold)})
                          </span>
                        )}

                        {/* DUPLICATE WARNING BADGE */}
                        {order.flagged && (
                          <span className="text-[10px] font-bold bg-rose-600 text-white px-1.5 py-0.5 rounded uppercase">
                            Flagged Duplicate
                          </span>
                        )}
                      </div>

                      <div className="text-xs text-slate-400">
                        Bill Date: <strong className="text-slate-700">{order.billDate}</strong> | Bill #{' '}
                        <strong className="text-slate-800">{order.billNo}</strong>
                      </div>
                    </div>

                    {/* Duplicate alert message if flagged */}
                    {order.flagged && (
                      <div className="bg-rose-50 border border-rose-200 rounded-lg p-2 text-xs text-rose-700 flex items-start space-x-2">
                        <span>🚨</span>
                        <div>
                          <strong>Duplicate Warning:</strong> {order.flagReason}
                        </div>
                      </div>
                    )}

                    {/* Middle Details: Event & Items summary */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                      <div>
                        <span className="text-slate-400 block">Event / Purpose:</span>
                        <span className="font-semibold text-slate-800">{order.event}</span>
                        <span className="text-slate-500 block text-[11px] mt-0.5">Requested by: {order.requestedBy}</span>
                      </div>

                      <div>
                        <span className="text-slate-400 block">Line Items ({order.items.length}):</span>
                        <ul className="text-slate-600 space-y-0.5 text-[11px]">
                          {order.items.slice(0, 2).map((item, idx) => (
                            <li key={idx}>• {item.name} ({item.qty} × {formatINR(item.price)})</li>
                          ))}
                          {order.items.length > 2 && (
                            <li className="text-slate-400 italic">+{order.items.length - 2} more item(s)...</li>
                          )}
                        </ul>
                      </div>

                      <div className="md:text-right">
                        <span className="text-slate-400 block">Bill Total:</span>
                        <span className="text-base font-extrabold text-indigo-700">{formatINR(order.total)}</span>
                        
                        {(order.status === 'Partially paid' || order.status === 'Paid') && (
                          <div className="text-[11px] mt-1 space-y-0.5">
                            <span className="text-emerald-700 font-semibold block">Paid: {formatINR(totalPaid)}</span>
                            {balance > 0 && <span className="text-amber-700 font-semibold block">Due: {formatINR(balance)}</span>}
                          </div>
                        )}
                      </div>
                    </div>

                    {/* Bottom Action Footer */}
                    <div className="pt-2 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2">
                      <button
                        onClick={() => onPrintOrder(order)}
                        className="text-xs text-slate-500 hover:text-slate-800 font-medium flex items-center space-x-1"
                      >
                        <span>🖨️ View / Print Voucher</span>
                      </button>

                      <div className="flex flex-wrap items-center gap-2">
                        {/* TREASURER APPROVAL CONTROLS */}
                        {role === 'treasurer' && order.clubId === selectedTreasurerClubId && order.status === 'Awaiting code' && (
                          <>
                            <button
                              onClick={() => onOpenAuthModal('reject', order)}
                              className="px-2.5 py-1 text-xs font-semibold text-rose-700 bg-rose-50 hover:bg-rose-100 rounded-lg border border-rose-200"
                            >
                              Reject PO
                            </button>
                            <button
                              onClick={() => onOpenAuthModal('authorize', order)}
                              className="px-3 py-1 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm"
                            >
                              Authorize with Code &rarr;
                            </button>
                          </>
                        )}

                        {/* PAYMENT RECORDING (Available to Treasurer & Shopkeeper for authorized orders) */}
                        {(order.status === 'Authorized' || order.status === 'Partially paid') && (
                          <button
                            onClick={() => handleStartPayment(order)}
                            className="px-3 py-1 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg shadow-sm flex items-center space-x-1"
                          >
                            <span>💳 Record Payment ({formatINR(balance)} due)</span>
                          </button>
                        )}
                      </div>
                    </div>

                  </div>
                );
              })}
            </div>
          )}

          {/* ========================================================= */}
          {/* RECORD PAYMENT MODAL (Step 1: Details entry) */}
          {/* ========================================================= */}
          {paymentModalOrder && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <h3 className="text-base font-bold text-slate-900">Record Payment for {paymentModalOrder.id}</h3>
                  <button 
                    onClick={() => setPaymentModalOrder(null)}
                    className="text-slate-400 hover:text-slate-600 text-xl font-bold"
                  >
                    &times;
                  </button>
                </div>

                <form onSubmit={handleSubmitPaymentForm} className="space-y-3 mt-4 text-xs">
                  <div className="bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                    <div className="flex justify-between text-slate-600">
                      <span>Order Total:</span>
                      <strong>{formatINR(paymentModalOrder.total)}</strong>
                    </div>
                    <div className="flex justify-between text-slate-600 mt-1">
                      <span>Already Settled:</span>
                      <strong className="text-emerald-700">
                        {formatINR(getOrderPaymentSummary(paymentModalOrder.id).totalPaid)}
                      </strong>
                    </div>
                    <div className="flex justify-between text-slate-800 font-bold border-t pt-1 mt-1">
                      <span>Remaining Balance:</span>
                      <strong className="text-indigo-700">
                        {formatINR(paymentModalOrder.total - getOrderPaymentSummary(paymentModalOrder.id).totalPaid)}
                      </strong>
                    </div>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Amount to Pay (INR) *</label>
                    <input
                      type="number"
                      required
                      min={1}
                      max={paymentModalOrder.total - getOrderPaymentSummary(paymentModalOrder.id).totalPaid}
                      value={paymentForm.amount}
                      onChange={(e) => setPaymentForm(prev => ({ ...prev, amount: e.target.value, error: '' }))}
                      className="w-full px-3 py-2 border rounded-lg font-bold text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    />
                    <p className="text-[10px] text-slate-400 mt-0.5">Supports partial installments. Rejects any amount exceeding remaining balance.</p>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Payment Mode *</label>
                      <select
                        value={paymentForm.mode}
                        onChange={(e) => setPaymentForm(prev => ({ ...prev, mode: e.target.value }))}
                        className="w-full px-2 py-2 border rounded-lg bg-white"
                      >
                        <option value="UPI">UPI (GPay / PhonePe)</option>
                        <option value="Cash">Cash at Shop</option>
                        <option value="Bank transfer">Bank / NEFT / IMPS</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Payment Date *</label>
                      <input
                        type="date"
                        required
                        value={paymentForm.date}
                        onChange={(e) => setPaymentForm(prev => ({ ...prev, date: e.target.value }))}
                        className="w-full px-2 py-2 border rounded-lg bg-white"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Reference / UTR / Receipt No. *</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. UPI/20260928/18294 or CASH-REC-09"
                      value={paymentForm.reference}
                      onChange={(e) => setPaymentForm(prev => ({ ...prev, reference: e.target.value }))}
                      className="w-full px-3 py-2 border rounded-lg font-mono"
                    />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Notes (Optional)</label>
                    <input
                      type="text"
                      placeholder="e.g. 50% advance clearance"
                      value={paymentForm.note}
                      onChange={(e) => setPaymentForm(prev => ({ ...prev, note: e.target.value }))}
                      className="w-full px-3 py-2 border rounded-lg"
                    />
                  </div>

                  {paymentForm.error && (
                    <div className="p-2 bg-rose-50 text-rose-700 border border-rose-200 rounded font-semibold">
                      ⚠️ {paymentForm.error}
                    </div>
                  )}

                  <div className="flex space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setPaymentModalOrder(null)}
                      className="flex-1 py-2 border rounded-lg font-semibold text-slate-700"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-semibold shadow"
                    >
                      Next: Verify Passcode &rarr;
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // -------------------------------------------------------------
    // 4.2: NEW PURCHASE ORDER FORM
    // -------------------------------------------------------------
    function NewOrderForm({ clubs, onSubmitOrder, onCancel }) {
      const [clubId, setClubId] = useState(clubs[0]?.id || 'aimsa');
      const [subClub, setSubClub] = useState('');
      const [requestedBy, setRequestedBy] = useState('');
      const [event, setEvent] = useState('');
      const [billNo, setBillNo] = useState('');
      const [billDate, setBillDate] = useState(new Date().toISOString().slice(0, 10));
      
      const [items, setItems] = useState([
        { name: 'Chart Paper & Pins', qty: 10, price: 20 },
        { name: 'Tea & Refreshment Pack', qty: 25, price: 35 }
      ]);

      const [errors, setErrors] = useState({});

      const selectedClub = useMemo(() => clubs.find(c => c.id === clubId), [clubs, clubId]);

      // Reset sub-club when club changes
      useEffect(() => {
        setSubClub('');
      }, [clubId]);

      const handleAddItem = () => {
        setItems([...items, { name: '', qty: 1, price: 0 }]);
      };

      const handleRemoveItem = (index) => {
        if (items.length <= 1) return;
        setItems(items.filter((_, idx) => idx !== index));
      };

      const handleItemChange = (index, field, value) => {
        const updated = [...items];
        updated[index][field] = field === 'name' ? value : Number(value);
        setItems(updated);
      };

      const calculatedTotal = useMemo(() => {
        return items.reduce((sum, item) => sum + (Number(item.qty) || 0) * (Number(item.price) || 0), 0);
      }, [items]);

      const validateForm = () => {
        const newErr = {};
        if (!requestedBy.trim()) newErr.requestedBy = "Please specify member name who collected or raised the bill.";
        if (!event.trim()) newErr.event = "Please enter an event or workshop name.";
        if (!billNo.trim()) newErr.billNo = "Enter shop's physical bill or voucher reference number.";
        
        // Prevent future dates
        const today = new Date().toISOString().slice(0, 10);
        if (billDate > today) newErr.billDate = "Enter a bill date that is not in the future.";

        // Items validation
        const emptyItems = items.some(i => !i.name.trim() || i.qty <= 0 || i.price < 0);
        if (emptyItems) newErr.items = "All line items must have a description, positive quantity and non-negative unit price.";
        if (calculatedTotal <= 0) newErr.total = "Total order spend must be greater than Rs 0.";

        setErrors(newErr);
        return Object.keys(newErr).length === 0;
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!validateForm()) return;

        onSubmitOrder({
          clubId,
          subClub: selectedClub?.type === 'major' ? subClub : '',
          requestedBy: sanitize(requestedBy),
          event: sanitize(event),
          billNo: sanitize(billNo).toUpperCase(),
          billDate,
          items: items.map(i => ({ name: sanitize(i.name), qty: Number(i.qty), price: Number(i.price) })),
          total: calculatedTotal
        });
      };

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm max-w-3xl mx-auto space-y-5">
          <div className="border-b pb-3">
            <h2 className="text-base font-bold text-slate-900">Raise New Purchase Order</h2>
            <p className="text-xs text-slate-500">
              Orders enter the ledger in <span className="font-semibold text-slate-700">"Awaiting treasurer code"</span> state and are never billable until authenticated.
            </p>
          </div>

          <form onSubmit={handleSubmit} className="space-y-4 text-xs">
            
            {/* Club & Sub-Club Selectors */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block font-semibold text-slate-700 mb-1">Select Club / Department *</label>
                <select
                  value={clubId}
                  onChange={(e) => setClubId(e.target.value)}
                  className="w-full p-2.5 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                >
                  {clubs.map(c => (
                    <option key={c.id} value={c.id}>
                      {c.name} {c.type === 'major' ? '(Major Club)' : ''}
                    </option>
                  ))}
                </select>
              </div>

              {selectedClub?.type === 'major' && selectedClub.subClubs.length > 0 ? (
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Sub-Club / Department Wing *</label>
                  <select
                    value={subClub}
                    onChange={(e) => setSubClub(e.target.value)}
                    className="w-full p-2.5 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  >
                    <option value="">-- Choose Sub-Club --</option>
                    {selectedClub.subClubs.map((sub, i) => (
                      <option key={i} value={sub}>{sub}</option>
                    ))}
                  </select>
                </div>
              ) : (
                <div>
                  <label className="block font-semibold text-slate-400 mb-1">Sub-Club</label>
                  <input
                    type="text"
                    disabled
                    value="No sub-clubs for this entity"
                    className="w-full p-2.5 border border-slate-200 rounded-lg bg-slate-100 text-slate-400"
                  />
                </div>
              )}
            </div>

            {/* Requested By & Event */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block font-semibold text-slate-700 mb-1">Requested By (Member Name) *</label>
                <input
                  type="text"
                  placeholder="e.g. Tanmay Bhat (Event Head)"
                  value={requestedBy}
                  onChange={(e) => setRequestedBy(e.target.value)}
                  className={`w-full p-2.5 border rounded-lg focus:outline-none ${errors.requestedBy ? 'border-rose-500 bg-rose-50' : 'border-slate-300'}`}
                />
                {errors.requestedBy && <p className="text-rose-600 text-[11px] mt-1">{errors.requestedBy}</p>}
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Event / Workshop Name *</label>
                <input
                  type="text"
                  placeholder="e.g. Autonomous Bot Championship"
                  value={event}
                  onChange={(e) => setEvent(e.target.value)}
                  className={`w-full p-2.5 border rounded-lg focus:outline-none ${errors.event ? 'border-rose-500 bg-rose-50' : 'border-slate-300'}`}
                />
                {errors.event && <p className="text-rose-600 text-[11px] mt-1">{errors.event}</p>}
              </div>
            </div>

            {/* Shop Bill Number & Date */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block font-semibold text-slate-700 mb-1">Shop Physical Bill Number *</label>
                <input
                  type="text"
                  placeholder="e.g. SHP-9340"
                  value={billNo}
                  onChange={(e) => setBillNo(e.target.value)}
                  className={`w-full p-2.5 border rounded-lg font-mono uppercase focus:outline-none ${errors.billNo ? 'border-rose-500 bg-rose-50' : 'border-slate-300'}`}
                />
                <p className="text-[10px] text-slate-400 mt-0.5">Scanned for duplicate collisions across all 21 clubs.</p>
                {errors.billNo && <p className="text-rose-600 text-[11px] mt-1">{errors.billNo}</p>}
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Bill Date *</label>
                <input
                  type="date"
                  value={billDate}
                  onChange={(e) => setBillDate(e.target.value)}
                  className={`w-full p-2.5 border rounded-lg focus:outline-none ${errors.billDate ? 'border-rose-500 bg-rose-50' : 'border-slate-300'}`}
                />
                {errors.billDate && <p className="text-rose-600 text-[11px] mt-1">{errors.billDate}</p>}
              </div>
            </div>

            {/* LINE ITEMS TABLE */}
            <div className="border border-slate-200 rounded-xl p-3 bg-slate-50 space-y-3">
              <div className="flex justify-between items-center">
                <span className="font-bold text-slate-800">Stationery & Refreshment Line Items</span>
                <button
                  type="button"
                  onClick={handleAddItem}
                  className="px-2 py-1 bg-white border border-slate-300 text-indigo-600 font-semibold rounded hover:bg-indigo-50"
                >
                  + Add Item Row
                </button>
              </div>

              <div className="space-y-2">
                {items.map((item, idx) => (
                  <div key={idx} className="flex items-center gap-2">
                    <input
                      type="text"
                      placeholder="Item name (e.g. Whiteboard Markers)"
                      value={item.name}
                      onChange={(e) => handleItemChange(idx, 'name', e.target.value)}
                      className="flex-3 w-full p-2 border rounded bg-white"
                    />
                    <input
                      type="number"
                      min={1}
                      placeholder="Qty"
                      value={item.qty}
                      onChange={(e) => handleItemChange(idx, 'qty', e.target.value)}
                      className="w-16 p-2 border rounded bg-white text-center"
                    />
                    <input
                      type="number"
                      min={0}
                      placeholder="Price each"
                      value={item.price}
                      onChange={(e) => handleItemChange(idx, 'price', e.target.value)}
                      className="w-24 p-2 border rounded bg-white text-right"
                    />
                    <div className="w-24 text-right font-bold text-slate-700">
                      {formatINR((item.qty || 0) * (item.price || 0))}
                    </div>
                    {items.length > 1 && (
                      <button
                        type="button"
                        onClick={() => handleRemoveItem(idx)}
                        className="text-rose-500 hover:text-rose-700 font-bold px-2 py-1"
                        title="Remove row"
                      >
                        ✕
                      </button>
                    )}
                  </div>
                ))}
              </div>

              {errors.items && <p className="text-rose-600 text-[11px]">{errors.items}</p>}

              <div className="border-t border-slate-200 pt-2 flex justify-between items-center text-sm font-bold">
                <span className="text-slate-600">Calculated PO Total:</span>
                <span className="text-indigo-700 text-base">{formatINR(calculatedTotal)}</span>
              </div>
            </div>

            {/* ACTION BUTTONS */}
            <div className="flex space-x-3 pt-3">
              <button
                type="button"
                onClick={onCancel}
                className="w-1/3 py-2.5 border border-slate-300 rounded-lg font-semibold text-slate-700 hover:bg-slate-50"
              >
                Cancel
              </button>
              <button
                type="submit"
                className="w-2/3 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-bold shadow-md"
              >
                Submit Purchase Order &rarr;
              </button>
            </div>
          </form>
        </div>
      );
    }

    // -------------------------------------------------------------
    // 4.3: CLUBS & BUDGET LEDGER VIEW
    // -------------------------------------------------------------
    function ClubsLedgerView({ ledgers, role, onUnlockClub, onPrintClubStatement }) {
      const [typeFilter, setTypeFilter] = useState('all');

      const filteredClubs = useMemo(() => {
        if (typeFilter === 'major') return ledgers.filter(c => c.type === 'major');
        if (typeFilter === 'other') return ledgers.filter(c => c.type !== 'major');
        return ledgers;
      }, [ledgers, typeFilter]);

      return (
        <div className="space-y-4">
          <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h2 className="text-base font-bold text-slate-900">Club Financial Ledgers ({ledgers.length} Entities)</h2>
              <p className="text-xs text-slate-500">Live annual allocation, authorized spend, and remaining shop budget progress.</p>
            </div>
            <div>
              <select
                value={typeFilter}
                onChange={(e) => setTypeFilter(e.target.value)}
                className="text-xs py-1.5 px-3 border border-slate-300 rounded-lg bg-white text-slate-700"
              >
                <option value="all">All Club Classifications</option>
                <option value="major">Major Clubs (With Sub-Clubs)</option>
                <option value="other">Department & Motor Clubs</option>
              </select>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {filteredClubs.map(club => {
              const isOver80 = club.percentSpent >= 80 && club.percentSpent <= 100;
              const isOverBudget = club.percentSpent > 100;

              return (
                <div 
                  key={club.id} 
                  className={`bg-white rounded-xl border p-4 shadow-sm transition space-y-3 ${
                    club.locked ? 'border-rose-300 bg-rose-50/20' : 'border-slate-200 hover:border-slate-300'
                  }`}
                >
                  <div className="flex items-start justify-between">
                    <div>
                      <div className="flex items-center space-x-2">
                        <h3 className="font-bold text-sm text-slate-900">{club.name}</h3>
                        {club.locked && (
                          <span className="text-[10px] font-bold bg-rose-600 text-white px-1.5 py-0.5 rounded">
                            🔒 LOCKED (3 WRONG CODES)
                          </span>
                        )}
                      </div>
                      <p className="text-xs text-slate-500">
                        Treasurer: <span className="font-medium text-slate-700">{club.treasurerName}</span> ({club.treasurerContact})
                      </p>
                    </div>

                    <span className="text-xs px-2 py-0.5 rounded font-mono font-bold bg-slate-100 text-slate-600">
                      {club.type === 'major' ? 'Major Branch' : 'Association'}
                    </span>
                  </div>

                  {/* Sub-clubs indicator if any */}
                  {club.subClubs && club.subClubs.length > 0 && (
                    <div className="text-[11px] text-slate-500 bg-slate-50 p-2 rounded border border-slate-100">
                      <strong>Wings ({club.subClubs.length}):</strong> {club.subClubs.join(', ')}
                    </div>
                  )}

                  {/* BUDGET PROGRESS BAR */}
                  <div className="space-y-1">
                    <div className="flex justify-between text-xs font-semibold">
                      <span>Spent: {formatINR(club.spent)} ({Math.round(club.percentSpent)}%)</span>
                      <span>Budget: {formatINR(club.annualBudget)}</span>
                    </div>

                    <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                      <div 
                        className={`h-full transition-all duration-500 ${
                          isOverBudget ? 'bg-rose-600' :
                          isOver80 ? 'bg-amber-500' : 'bg-emerald-500'
                        }`}
                        style={{ width: `${Math.min(100, club.percentSpent)}%` }}
                      ></div>
                    </div>

                    {isOverBudget && (
                      <p className="text-[11px] text-rose-600 font-bold">
                        ⚠️ Budget Exceeded by {formatINR(Math.abs(club.remaining))}!
                      </p>
                    )}
                    {isOver80 && !isOverBudget && (
                      <p className="text-[11px] text-amber-700 font-semibold">
                        ⚠️ Warning: Spend has passed 80% threshold of annual allotment.
                      </p>
                    )}
                  </div>

                  {/* Financial Breakdown Grid */}
                  <div className="grid grid-cols-3 gap-2 bg-slate-50 p-2.5 rounded-lg text-xs text-center border border-slate-100">
                    <div>
                      <span className="text-slate-400 block text-[10px]">PAID</span>
                      <span className="font-bold text-emerald-700">{formatINR(club.paid)}</span>
                    </div>
                    <div>
                      <span className="text-slate-400 block text-[10px]">SHOP DUES</span>
                      <span className="font-bold text-amber-700">{formatINR(club.pending)}</span>
                    </div>
                    <div>
                      <span className="text-slate-400 block text-[10px]">REMAINING</span>
                      <span className={`font-bold ${club.remaining < 0 ? 'text-rose-600' : 'text-slate-800'}`}>
                        {formatINR(club.remaining)}
                      </span>
                    </div>
                  </div>

                  {/* Actions Row */}
                  <div className="pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                    <button
                      onClick={() => onPrintClubStatement(club)}
                      className="text-indigo-600 font-semibold hover:underline"
                    >
                      Print Ledger Statement &rarr;
                    </button>

                    {role === 'admin' && club.locked && (
                      <button
                        onClick={() => onUnlockClub(club.id)}
                        className="px-2.5 py-1 bg-rose-600 text-white font-bold rounded shadow hover:bg-rose-700"
                      >
                        Reset & Unlock Club
                      </button>
                    )}
                  </div>

                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // 4.4: PAYMENTS LIST VIEW
    // -------------------------------------------------------------
    function PaymentsListView({ payments, orders, clubs, role, selectedTreasurerClubId, onExportCSV }) {
      const [filterMode, setFilterMode] = useState('all');

      const visiblePayments = useMemo(() => {
        return payments.filter(p => {
          if (role === 'treasurer' && p.clubId !== selectedTreasurerClubId) return false;
          if (filterMode !== 'all' && p.mode !== filterMode) return false;
          return true;
        });
      }, [payments, role, selectedTreasurerClubId, filterMode]);

      const totalPaidAmount = useMemo(() => {
        return visiblePayments.reduce((sum, p) => sum + p.amount, 0);
      }, [visiblePayments]);

      return (
        <div className="space-y-4">
          <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h2 className="text-base font-bold text-slate-900">Payments Registry</h2>
              <p className="text-xs text-slate-500">
                Total settled in this view: <strong className="text-emerald-700">{formatINR(totalPaidAmount)}</strong>
              </p>
            </div>

            <div className="flex items-center space-x-2">
              <select
                value={filterMode}
                onChange={(e) => setFilterMode(e.target.value)}
                className="text-xs py-1.5 px-3 border border-slate-300 rounded-lg bg-white"
              >
                <option value="all">All Modes</option>
                <option value="UPI">UPI</option>
                <option value="Cash">Cash</option>
                <option value="Bank transfer">Bank Transfer</option>
              </select>

              <button
                onClick={onExportCSV}
                className="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg border border-slate-300"
              >
                Export CSV
              </button>
            </div>
          </div>

          <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto shadow-sm">
            <table className="w-full text-left text-xs">
              <thead className="bg-slate-50 border-b border-slate-200 font-semibold text-slate-600">
                <tr>
                  <th className="p-3">Payment ID</th>
                  <th className="p-3">Order Ref</th>
                  <th className="p-3">Club</th>
                  <th className="p-3">Date</th>
                  <th className="p-3">Mode</th>
                  <th className="p-3">Reference / UTR</th>
                  <th className="p-3 text-right">Amount Paid</th>
                  <th className="p-3">Signed By</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {visiblePayments.length === 0 ? (
                  <tr>
                    <td colSpan={8} className="p-6 text-center text-slate-400">
                      No payment records found.
                    </td>
                  </tr>
                ) : (
                  visiblePayments.map(pay => {
                    const club = clubs.find(c => c.id === pay.clubId);
                    return (
                      <tr key={pay.id} className="hover:bg-slate-50">
                        <td className="p-3 font-mono font-bold text-slate-800">{pay.id}</td>
                        <td className="p-3 font-mono text-indigo-600">{pay.orderId}</td>
                        <td className="p-3 font-medium text-slate-900">{club?.name}</td>
                        <td className="p-3 text-slate-600">{pay.date}</td>
                        <td className="p-3">
                          <span className="px-2 py-0.5 bg-slate-100 font-medium rounded text-[11px]">
                            {pay.mode}
                          </span>
                        </td>
                        <td className="p-3 font-mono text-slate-700">{pay.reference}</td>
                        <td className="p-3 text-right font-extrabold text-emerald-700">{formatINR(pay.amount)}</td>
                        <td className="p-3 text-slate-500 text-[11px]">{pay.recordedBy}</td>
                      </tr>
                    );
                  })
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // 4.5: FLAGS & ANTI-FRAUD VIEW
    // -------------------------------------------------------------
    function FlagsSecurityView({ flags, orders, clubs, role, selectedTreasurerClubId, onOpenAuthModal, onAdminReviewFlag, onAdminUnlockClub }) {
      return (
        <div className="space-y-4">
          <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            <h2 className="text-base font-bold text-slate-900">Anti-Fraud & Duplicate Bill Security Center</h2>
            <p className="text-xs text-slate-500">
              Heuristic detection flags repeated bill numbers, same-day expense collisions, and short-interval duplicate items.
            </p>
          </div>

          <div className="space-y-3">
            {flags.length === 0 ? (
              <div className="bg-white p-8 rounded-xl border border-slate-200 text-center">
                <span className="text-3xl">🛡️</span>
                <p className="text-xs text-slate-500 mt-2">Zero active duplicate flags. All orders pass verification checks.</p>
              </div>
            ) : (
              flags.map(flag => {
                const order = orders.find(o => o.id === flag.orderId);
                const club = clubs.find(c => c.id === flag.clubId);

                return (
                  <div key={flag.id} className="bg-white p-4 rounded-xl border border-rose-200 shadow-sm space-y-3">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-rose-100 pb-2">
                      <div className="flex items-center space-x-2">
                        <span className="px-2 py-0.5 bg-rose-100 text-rose-800 font-mono text-xs font-bold rounded">
                          {flag.id}
                        </span>
                        <span className="text-xs font-bold text-slate-900">{club?.name}</span>
                        <span className="text-xs text-slate-400">Order #{flag.orderId}</span>
                      </div>

                      <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full ${
                        flag.status === 'pending' ? 'bg-amber-100 text-amber-800' :
                        flag.status === 'confirmed_duplicate' ? 'bg-rose-600 text-white' : 'bg-emerald-100 text-emerald-800'
                      }`}>
                        {flag.status === 'pending' ? 'Pending Review' :
                         flag.status === 'confirmed_duplicate' ? 'Confirmed Duplicate (Voided)' : 'Reviewed: Valid Purchase'}
                      </span>
                    </div>

                    <div className="bg-rose-50/70 p-3 rounded-lg text-xs text-rose-800 space-y-1 border border-rose-200">
                      <strong>Flag Reason:</strong> {flag.reason}
                    </div>

                    {order && (
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs text-slate-600">
                        <div>Event: <strong className="text-slate-800">{order.event}</strong></div>
                        <div>Bill No: <strong className="text-slate-800">{order.billNo}</strong></div>
                        <div>Total: <strong className="text-indigo-700">{formatINR(order.total)}</strong></div>
                        <div>Date: <strong className="text-slate-800">{order.billDate}</strong></div>
                      </div>
                    )}

                    {/* DECISION BUTTONS */}
                    {flag.status === 'pending' && (
                      <div className="pt-2 border-t border-slate-100 flex flex-wrap items-center justify-end gap-2 text-xs">
                        {role === 'admin' ? (
                          <>
                            <button
                              onClick={() => onAdminReviewFlag(flag, 'resolved_valid')}
                              className="px-3 py-1.5 border border-slate-300 font-semibold rounded-lg text-slate-700 hover:bg-slate-50"
                            >
                              Admin Override: Mark Valid
                            </button>
                            <button
                              onClick={() => onAdminReviewFlag(flag, 'confirmed_duplicate')}
                              className="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-lg shadow-sm"
                            >
                              Admin: Confirm Duplicate (Void Order)
                            </button>
                          </>
                        ) : role === 'treasurer' && flag.clubId === selectedTreasurerClubId ? (
                          <>
                            <button
                              onClick={() => onOpenAuthModal('review_flag', order, { flag, decision: 'resolved_valid' })}
                              className="px-3 py-1.5 border border-slate-300 font-semibold rounded-lg text-slate-700 hover:bg-slate-50"
                            >
                              Verify Valid with Passcode
                            </button>
                            <button
                              onClick={() => onOpenAuthModal('review_flag', order, { flag, decision: 'confirmed_duplicate' })}
                              className="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-lg shadow-sm"
                            >
                              Confirm Duplicate (Reversal Entry)
                            </button>
                          </>
                        ) : (
                          <span className="text-slate-400 italic">Reviewable by Club Treasurer or Faculty Coordinator.</span>
                        )}
                      </div>
                    )}

                    {flag.status !== 'pending' && (
                      <div className="text-[11px] text-slate-500 pt-1">
                        Reviewed by: <strong className="text-slate-700">{flag.reviewedBy}</strong> on {flag.reviewedAt?.slice(0, 10)}
                      </div>
                    )}

                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // 4.6: REPORTS & INSIGHTS VIEW
    // -------------------------------------------------------------
    function ReportsView({ globalStats, clubLedgers, orders, role, highValueThreshold, onUpdateThreshold }) {
      return (
        <div className="space-y-5">
          {/* Top Metric Cards */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
              <span className="text-xs text-slate-500 block">Total Budget Allocation</span>
              <span className="text-base sm:text-lg font-bold text-slate-900">{formatINR(globalStats.totalBudget)}</span>
            </div>

            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
              <span className="text-xs text-slate-500 block">Total Authorized Spend</span>
              <span className="text-base sm:text-lg font-bold text-indigo-700">{formatINR(globalStats.totalSpent)}</span>
            </div>

            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
              <span className="text-xs text-slate-500 block">Total Shop Dues Pending</span>
              <span className="text-base sm:text-lg font-bold text-amber-600">{formatINR(globalStats.totalPendingToShop)}</span>
            </div>

            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
              <span className="text-xs text-slate-500 block">Flagged / Locked Clubs</span>
              <span className="text-base sm:text-lg font-bold text-rose-600">
                {globalStats.flaggedCount} Flags / {globalStats.lockedClubsCount} Locked
              </span>
            </div>
          </div>

          {/* Configurable High Value Anomaly Setting */}
          {role === 'admin' && (
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between text-xs">
              <div>
                <span className="font-bold text-slate-800">Anomaly Highlight Threshold:</span>
                <p className="text-slate-500">Orders exceeding this amount are automatically flagged with a "High value" badge.</p>
              </div>
              <div className="flex items-center space-x-2">
                <span className="font-bold">Rs</span>
                <input
                  type="number"
                  step={500}
                  value={highValueThreshold}
                  onChange={(e) => onUpdateThreshold(Number(e.target.value))}
                  className="w-24 p-1.5 border rounded text-right font-bold text-indigo-700"
                />
              </div>
            </div>
          )}

          {/* TOP 5 SPENDERS BAR CHART (Pure CSS / SVG) */}
          <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
            <h3 className="font-bold text-sm text-slate-900">Top 5 Spending Clubs</h3>
            <p className="text-xs text-slate-500">Comparing authorized purchase volumes against initial allocations.</p>

            <div className="space-y-3 pt-2">
              {globalStats.top5Spenders.map(club => {
                const maxVal = globalStats.top5Spenders[0]?.spent || 1;
                const widthPercent = Math.max(5, (club.spent / maxVal) * 100);

                return (
                  <div key={club.id} className="space-y-1 text-xs">
                    <div className="flex justify-between font-medium">
                      <span>{club.name}</span>
                      <span className="font-bold text-slate-800">{formatINR(club.spent)}</span>
                    </div>
                    <div className="w-full bg-slate-100 h-4 rounded-md overflow-hidden flex items-center">
                      <div 
                        className="bg-indigo-600 h-full rounded-md transition-all duration-500" 
                        style={{ width: `${widthPercent}%` }}
                      ></div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* EVENT-WISE SPEND SUMMARY */}
          <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
            <h3 className="font-bold text-sm text-slate-900">Event-wise Expense Breakdown</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
                  <tr>
                    <th className="p-2.5">Event Name</th>
                    <th className="p-2.5">Club</th>
                    <th className="p-2.5">Date</th>
                    <th className="p-2.5 text-right">Total Cost</th>
                    <th className="p-2.5 text-center">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {orders.map(o => (
                    <tr key={o.id}>
                      <td className="p-2.5 font-medium text-slate-900">{o.event}</td>
                      <td className="p-2.5 text-slate-600">{o.clubId.toUpperCase()}</td>
                      <td className="p-2.5 text-slate-500">{o.billDate}</td>
                      <td className="p-2.5 text-right font-bold text-slate-800">{formatINR(o.total)}</td>
                      <td className="p-2.5 text-center">
                        <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100">
                          {o.status}
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

        </div>
      );
    }

    // -------------------------------------------------------------
    // 4.7: AUDIT TRAIL VIEW (ADMIN EXCLUSIVE)
    // -------------------------------------------------------------
    function AuditTrailView({ auditLogs, clubs }) {
      const [actionFilter, setActionFilter] = useState('all');

      const filteredLogs = useMemo(() => {
        if (actionFilter === 'all') return auditLogs;
        return auditLogs.filter(l => l.action === actionFilter);
      }, [auditLogs, actionFilter]);

      return (
        <div className="space-y-4">
          <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <div className="flex items-center space-x-2">
                <span className="px-2 py-0.5 bg-purple-100 text-purple-800 font-mono text-xs font-bold rounded">
                  APPEND-ONLY
                </span>
                <h2 className="text-base font-bold text-slate-900">Immutable Audit Trail ({auditLogs.length} Events)</h2>
              </div>
              <p className="text-xs text-slate-500">Every authorization, payment, lockout, and reversal is logged permanently.</p>
            </div>

            <select
              value={actionFilter}
              onChange={(e) => setActionFilter(e.target.value)}
              className="text-xs py-1.5 px-3 border border-slate-300 rounded-lg bg-white"
            >
              <option value="all">All Action Types</option>
              <option value="ORDER_CREATED">Order Created</option>
              <option value="ORDER_AUTHORIZED">Order Authorized</option>
              <option value="ORDER_REJECTED">Order Rejected</option>
              <option value="PAYMENT_RECORDED">Payment Recorded</option>
              <option value="FAILED_CODE_ATTEMPT">Failed Code Attempt</option>
              <option value="CLUB_LOCKED">Club Locked</option>
              <option value="CLUB_UNLOCKED">Club Unlocked</option>
              <option value="DUPLICATE_FLAGGED">Duplicate Flagged</option>
              <option value="REVERSAL_ENTRY">Reversal Entry</option>
            </select>
          </div>

          <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto shadow-sm">
            <table className="w-full text-left text-xs">
              <thead className="bg-slate-50 border-b border-slate-200 font-semibold text-slate-600">
                <tr>
                  <th className="p-3">Log ID</th>
                  <th className="p-3">Timestamp</th>
                  <th className="p-3">Actor</th>
                  <th className="p-3">Action</th>
                  <th className="p-3">Target Entity</th>
                  <th className="p-3">Event Details</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 font-mono">
                {filteredLogs.map(log => {
                  const isAlert = log.action === 'CLUB_LOCKED' || log.action === 'FAILED_CODE_ATTEMPT' || log.action === 'DUPLICATE_FLAGGED';

                  return (
                    <tr key={log.id} className={isAlert ? 'bg-rose-50/50' : 'hover:bg-slate-50'}>
                      <td className="p-3 text-slate-400">{log.id}</td>
                      <td className="p-3 text-slate-500 whitespace-nowrap">{log.timestamp.replace('T', ' ').slice(0, 19)}</td>
                      <td className="p-3 font-medium text-slate-800 font-sans">{log.actor}</td>
                      <td className="p-3">
                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                          log.action === 'ORDER_AUTHORIZED' ? 'bg-indigo-100 text-indigo-800' :
                          log.action === 'PAYMENT_RECORDED' ? 'bg-emerald-100 text-emerald-800' :
                          log.action === 'CLUB_LOCKED' ? 'bg-rose-600 text-white' :
                          log.action === 'REVERSAL_ENTRY' ? 'bg-purple-100 text-purple-800' :
                          'bg-slate-200 text-slate-700'
                        }`}>
                          {log.action}
                        </span>
                      </td>
                      <td className="p-3 text-slate-700">{log.entity} #{log.entityId}</td>
                      <td className="p-3 font-sans text-slate-700">{log.details}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // Render the React application into root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
